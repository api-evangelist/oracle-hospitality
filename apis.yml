aid: oracle-hospitality
url: https://raw.githubusercontent.com/api-evangelist/oracle-hospitality/refs/heads/main/apis.yml
name: Oracle Hospitality
kind: company
description: 'Oracle Hospitality is Oracle Corporation''s hotel and food-and-beverage technology line, built on
  the 2014 acquisition of MICROS Systems and anchored by OPERA Cloud, the property management system that runs the
  front desk, reservations, housekeeping, cashiering and event sales for a large share of the world''s branded hotel
  rooms, alongside OPERA Cloud Distribution, Simphony point of sale and Nor1 upsell. Home market is the United States.
  It sits in the middle of the hotel distribution chain rather than at either end: it is the system of record a
  property runs on, and the switch through which that property''s availability, rates and inventory reach GDS, OTA
  and web channels and through which reservations come back. Its API posture is unusually open at the specification
  layer and firmly gated at the credential layer - Oracle publishes 59 Swagger 2.0 specifications covering roughly
  3,500 operations to a public GitHub repository under the Universal Permissive License, and publishes the full
  Oracle Hospitality Integration Platform (OHIP) developer guide openly, but there is no self-serve signup: partners
  must purchase Oracle Hospitality Integration Cloud Service through the Oracle Store or a CPQ form, production
  access requires an Oracle Partner Network reference number, and distribution channel partners additionally need
  an Oracle-issued global Channel Code and an Oracle Cloud Marketplace listing.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/oracle.png
