  name: Nor1 Integrated Upsell API
  description: An upsell service that can be consumed to display upgrade offers to a hotel guest prior
    to arrival. Pre-arrival upsells are becoming increasingly important due to the adoption of mobile
    and kiosk check-in which reduces the opportunity for front-desk upselling. Upgrade offers are based
