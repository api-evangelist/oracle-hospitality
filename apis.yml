- aid: oracle-hospitality:opera-cloud-reservation-api
  name: OPERA Cloud Reservation API
  description: APIs to cater for Reservation functionality in OPERA Cloud. OPERA Cloud Reservations provides
    a complete set of capabilities for creating and updating reservations. Reservations are a central
    feature of OPERA Cloud. As a key source of information, the reservation specifies a guest's arrival
    date, departure date, room type, rate, packages, and many other details. It is also a gateway to dozens
    of other functions that contribute to the guest's experience. All reservations in OPERA Cloud require
    a guest profile. You can create profiles while booking a reservation. If a profile already exists,
    you can look it up (using getProfiles in CRM module) and attach it to the reservation during the reservation
    booking process using the Profile ID. Compatible with OPERA Cloud release 26.2.0.0. 184 operation(s)
