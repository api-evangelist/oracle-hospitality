- aid: oracle-hospitality:nor1-integrated-upsell-api
  name: Nor1 Integrated Upsell API
  description: An upsell service that can be consumed to display upgrade offers to a hotel guest prior to arrival.
    Pre-arrival upsells are becoming increasingly important due to the adoption of mobile and kiosk check-in
    which reduces the opportunity for front-desk upselling. Upgrade offers are based on PRiME(R) AI/ML decision
    intelligence and OPERA real-time inventory. The service allows instant fulfillment of the upgrade offer.
    Compatible with OPERA Cloud release 26.2.0.0. 2 operation(s) documented; base path /ohcgep/v1. Harvested
    verbatim from Oracle's public hospitality-api-docs repository (Swagger 2.0, release 26.2.0.0).
