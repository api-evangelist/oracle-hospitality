- aid: oracle-hospitality:opera-cloud-distribution-authentication-api
  name: OPERA Cloud Distribution Authentication API
  description: 'API to obtain the access token (in the JWT format) that matches the provided credentials issued
    by the Oracle Hospitality Distribution administrator for a specific Distribution channel partner. The token
    will then be used by API users to access OPERA Cloud Distribution APIS. Once a token is created, it can
    be used in multiple subsequent calls until it expires as defined in this API response. Username for a channel
    partner Distribution API account is provisioned by an Oracle administrator at the channel level. It is
    not an OPERA Cloud (PMS) user and not created or approved by the hotelier. Additionally, for each property,
    the hotelier will need to enable the channel so that it can access data for their specific hotel in the
    reservation context. More information on how to request a username and temporary password for a registered
    channel for Distribution APIs: Channel partners registered via OHIP receive credential(s) from the Oracle
    Hospitality Distribution administrator during the channel registration. Compatible with OPERA Cloud release
    26.2.0.0. 1 operation(s) documented; base path /hdpba/oauth2/v1. Harvested verbatim from Oracle''s public
    hospitality-api-docs repository (Swagger 2.0, release 26.2.0.0).'
  humanURL: https://github.com/oracle/hospitality-api-docs/blob/main/rest-api-specs/distribution/v1/hdpbaoauth2.json
