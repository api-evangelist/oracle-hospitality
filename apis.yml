- aid: oracle-hospitality:opera-cloud-distribution-reservation-service
  name: OPERA Cloud Distribution Reservation Service
  description: The OPERA Cloud Distribution Reservation API enables authorized channel partners to create,
    update, fetch and cancel reservations for properties managed through OPERA Cloud Foundation or OPERA Cloud
    Central, leveraging Oracle Hospitality Identity Management for secure access. Each request must include
    a valid channel code in the x-channelCode header. When a hotel maps its hotel, room type, and rate codes
    to channel-specific values, the API will return those mapped channel codes; otherwise, it will return the
    native OPERA Cloud codes. Compatible with OPERA Cloud release 26.2.0.0. 4 operation(s) documented; base
    path /distribution/v1. Harvested verbatim from Oracle's public hospitality-api-docs repository (Swagger
