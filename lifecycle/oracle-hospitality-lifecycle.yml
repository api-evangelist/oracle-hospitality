versioning:
  scheme: uri-path
  current: v1
  early_access: v0
  docs: https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_versioning.htm
  policy: >-
    APIs are exposed at /v0, /v1, /v2 and so on. Oracle's stated strategy is to avoid versions beyond v1
    by only introducing non-breaking changes; versions beyond v1 might be considered in future.
  release_train: >-
    Specifications are stamped with the OPERA Cloud SaaS release they are compatible with (26.2.0.0 for
    58 of the 59 harvested documents; 21.5.0.0 for the OHIP oAuth API and 1.0.1 for OPI Token Exchange).
  non_breaking_changes:
  - Adding new API operations
  - Adding new optional request parameters to existing API operations
  - Adding new properties to existing API responses
  - Adding new response headers
  - Changing the order of properties in existing API responses
  - Updating descriptions of API operations or properties
  - Adding or changing examples
  - Increasing the length of a string parameter
  - Changing from a more restrictive to a less restrictive numeric datatype
  - Deprecating an API operation
  - Adding items to or removing items from an ENUM
  - Adding new events
  breaking_changes:
  - Removing an entire API operation
  - Removing or renaming a request parameter
  - Removing or renaming a response parameter
  - Adding a new required request parameter
  - Making a previously optional parameter required
  - Changing the datatype of a parameter or response field
  - Adding a new validation rule to an existing request parameter
  - Changing authentication or authorization requirements
  - Enforcing new or lower limits on request parameters
  - Changing how resources are accessed
  - Request/response body size changes
  - Changing response error codes
