aid: oracle-hospitality
name: Oracle Hospitality
review:
  question: What would it cost a hotel or an integration partner to leave Oracle Hospitality, and what does Oracle
    actually publish about it?
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: hospitality-tech
  homeMarket: United States
  specsHarvested: 59
  operationsDocumented: 3519
findings:
  summary: 'Oracle Hospitality is the hotel-technology arm of Oracle Corporation, built on the 2014 MICROS Systems
    acquisition. OPERA Cloud is the property management system of record; OPERA Cloud Distribution is the channel/ARI
    switch that carries a property''s availability, rates and inventory out to GDS, OTA and web channels and carries
    reservations back; Nor1 handles upsell. The Oracle Hospitality Integration Platform (OHIP) is the single API
    front door for all of it.

    The specification layer is genuinely open: Oracle publishes 59 Swagger 2.0 documents covering 3,519 documented
    operations to a public GitHub repository (oracle/hospitality-api-docs) under the Universal Permissive License
    v1.0, alongside a fully public OHIP developer guide on docs.oracle.com. Every one of the 59 specs was fetched
    (HTTP 200) and parses.

    The credential layer is not open. There is no self-serve signup and no public developer portal URL: the portal
    is tenant-scoped (https://<ohip-domain>/<enterpriseID>prd/ui) and is issued by email on provisioning. Partners
    onboard by purchasing Oracle Hospitality Integration Cloud Service through the Oracle Store or a Cost Price
    Quote form; production applications require an Oracle Partner Network reference number; distribution channel
    partners additionally need an Oracle-issued global Channel Code and an Oracle Cloud Marketplace listing.

    The interesting switching-cost finding is that Oracle is actively migrating the industry OFF standards. The
    legacy interfaces it is retiring - HTNG (SOAP over OPERA Electronic Distribution Systems), OPERA Web Services
    (OWS), OPERA Xchange Interface (OXI) and Kiosk - are replaced by proprietary OPERA-modeled REST resources. OpenTravel
    survives only in narrow pockets: the Distribution ARI Publication outbound API still carries OTA_HotelInvCountNotifRQ,
    OTA_HotelRateAmountNotifRQ and OTA_HotelRestrictionsNotifRQ payload schemas, the Block API cites the OpenTravel
    Code List Unique ID Type (UIT), and the Cashiering API references OTA_ErrorRS enumerations.'
  transports:
  - protocol: REST
    scheme: https
    documented: true
    note: OHIP gateway; host is per-tenant and issued in the Developer Portal Environments tab, so no public baseURL
      is publishable. Specs carry basePath only (e.g. /rsv/v1).
  - protocol: WebSocket
    scheme: wss
    documented: true
    note: Business Events Streaming API (push), GraphQL subscription over WebSocket. Documented at https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_streaming_api.htm.
      Endpoint is per-tenant; not published.
  - protocol: SOAP
    scheme: https
    documented: true
    note: Legacy OWS / HTNG / OXI / Kiosk interfaces, explicitly in migration to REST per chapter 16 of the OHIP
      guide.
  productLines:
  - OPERA Cloud property management (Property APIs)
  - OPERA Cloud Distribution (Distribution APIs, ARI publication, channel connectivity)
  - Nor1 Integrated Upsell
  - Oracle Payment Interface (OPI tokenization, token exchange)
  - Oracle Hospitality Data APIs (bulk extraction from Reporting & Analytics subject areas)
  - Simphony point of sale (no public REST specification found in the harvested repository)
switchingCost:
  interfaceShape:
    value: standard-plus-proprietary
    standardsNamed:
    - OpenTravel Alliance (OTA) message schemas - OTA_HotelInvCountNotifRQ, OTA_HotelRateAmountNotifRQ, OTA_HotelRestrictionsNotifRQ
      in openapi/oracle-hospitality-distribution-outbound-aripublication.json
    - OpenTravel Code List Unique ID Type (UIT) referenced in openapi/oracle-hospitality-property-v1-blk.json
    - OTA_ErrorRS enumerations referenced in openapi/oracle-hospitality-property-v1-csh.json
    - HTNG - named only as a LEGACY OPERA Electronic Distribution Systems SOAP interface being migrated to proprietary
      REST (https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_htng.htm); also appears as an OEDS service name
      value in openapi/oracle-hospitality-property-v1-intcfg.json
    - OAuth 2.0 (password and client_credentials grants) and JSON Web Token RFC 7519, per openapi/oracle-hospitality-property-v1-oauth.json
    - Swagger 2.0 as the description format for all 59 specifications
    - PCI DSS referenced in the OHIP security guide (https://docs.oracle.com/en/industries/hospitality/integration-platform/ohips/toc.htm)
    proprietaryElements:
    - x-app-key application key header, issued per registered application and regenerated on suspension
    - x-hotelid / hotelId as the dominant resource key (1,863 path or query parameter occurrences across the corpus)
    - Oracle-issued global Channel Code, required to call Distribution APIs
    - enterpriseID and chain code baked into the tenant gateway URL and clientId format
    - OPERA-modeled REST resource vocabulary across ~3,500 operations that no other vendor implements
    assessment: A partner integrating against OHIP writes to an Oracle-specific REST vocabulary. The standards that
      do appear are either (a) confined to the outbound ARI publication path, where OTA payload schemas are preserved
      because channel partners already speak them, or (b) generic web standards (OAuth 2.0, JWT, Swagger 2.0) that
      describe the envelope, not the domain model. The domain model itself is proprietary, and Oracle is deliberately
      moving customers from standards-based SOAP (HTNG, OWS) onto it.
  secondSource:
    value: alternatives-with-migration
    alternativesConsidered:
    - 'Property management systems: Agilysys, Infor Hospitality Management Solution, Amadeus Hospitality, Sabre
      SynXis Property Hub, Shiji Enterprise Platform, Mews, Cloudbeds, Apaleo, StayNTouch, protel (Planet), RMS
      Cloud'
    - 'Channel management / distribution: SiteMinder, Derbysoft, RateGain, Amadeus (formerly TravelClick) iHotelier,
      Sabre SynXis Central Reservations'
    - 'Point of sale (against Simphony): Agilysys InfoGenesis, Toast, Lightspeed, Shiji Infrasys'
    assessment: 'Real competitors exist at every layer, so this is not a no-alternative position. But there is no
      shared PMS data model in hospitality the way NDC or OTA exist in distribution, so a replacement is a rebuild:
      every one of a property or chain''s integrations - door locks, POS, spa, revenue management, CRM, payment,
      loyalty - is written against OPERA resource shapes and would be rewritten. Oracle publishes its own evidence
      for how large that job is: chapter 16 of the OHIP guide is a legacy-to-REST migration mapping table, operation
      by operation, for customers moving WITHIN Oracle. Moving out has no such map.'
  exitPath:
    value: bulk-export-documented
    operationsCited:
    - 'GET /availableExports, GET /{exportFileId}/generatedExports, POST /exportSchedules, GET /hotels/{hotelId}/exportSchedules
      - OPERA Cloud Export Configuration API, openapi/oracle-hospitality-property-v1-expcfg.json (22 operations).
      Spec description: "The exports feature in OPERA Cloud provides the ability to create and export data files,
      such as back office data, to third-party interfaces and receiving systems."'
    - Oracle Hospitality Data APIs - "Use these APIs for bulk data access where the extraction of large amounts
      of data is required... allow bulk data to be queried from Reporting & Analytics to avoid any performance impact
      on the transactional OPERA Cloud platform." (https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_oracle_hospitality_data_apis.htm).
      No Swagger specification for these is published in the GitHub repository.
    - 'Asynchronous APIs - blkasync, crmasync, cshasync, invasync, parasync, rsvasync, rtpasync specs. Per https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_opera_xchange_interface_oxi.htm:
      "The REST Property APIs have Asynchronous APIs, which enable the user to send a REST request to OPERA Cloud
      for a significant amount of data (for example, 30 days of reservations)."'
    caveats:
    - 'The one thing explicitly NOT self-service is portability of the integration configuration itself: "If you
      need a Portable Export of your Application Details, create a ticket in the Customer Support Portal." (https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_portable_export.htm)
      - that part is export-on-request.'
    - Export is of operational data into files and reporting subject areas. No documented operation exports the
      OPERA configuration model (rate plans, room types, chain and hotel configuration) as a portable package for
      migration to another vendor.
    - No GDPR / consumer data-portability endpoint was found in the corpus.
  identifierPortability:
    shared:
    - 'IATA travel-agency numbers, with an explicit idContext field: "Used to identify the source of the identifier
      (e.g., IATA, ABTA)" (openapi/oracle-hospitality-distribution-v1-distribution.json)'
    - IATA 3-letter airport and city codes (airportCode in distribution book/shop specs, hotelCityCode in act.json)
    - GDS record locators - recordLocator "GDS Record Locator" in openapi/oracle-hospitality-property-v1-rsv.json
      and a "GDS Record Locator for reservation" query parameter in fof.json
    - Group IATA number (gIId) validated by an external system, openapi/oracle-hospitality-property-v1-blk.json
    - OpenTravel UniqueID Type (UIT) code list reference, blk.json
    - IATA number validation operation on travel-agency profiles, openapi/oracle-hospitality-property-outbound-crmoutbound.json
    proprietary:
    - hotelId - the OPERA property code, the single most common parameter in the corpus (1,863 occurrences)
    - chain code and enterpriseID, embedded in the gateway URL and the OCIM clientId format "<chain><environment><enterprise>Client"
    - reservationId (261), profileId (107), blockId (119), roomId, accountId - OPERA-internal surrogate keys
    - extSystemCode and channelCode - Oracle-issued external system and channel identifiers
    - Oracle-issued global Channel Code, one per distribution partner, reused across every property
    notFound:
    - GIATA IDs
    - HTNG hotel identifiers
    - GDS-native chain codes as a first-class key
    summary: Mixed. Guest, agency and reservation records carry portable industry identifiers - IATA agency numbers,
      IATA airport/city codes, GDS record locators, OpenTravel UIT - so the travel-industry edges of the data travel.
      Everything that binds those records together inside OPERA (hotelId, chain, enterpriseID, reservationId, profileId,
      blockId, channelCode) is an Oracle-internal key with no external registry.
  contractualLockIn:
    published:
    - source: https://docs.oracle.com/cd/F29336_01/doc.201/f27480/t_getting_started_for_partners.htm
      quote: 'There are two ways to onboard partners to the Oracle Hospitality Integration Cloud Service: Oracle
        Store - You can onboard by purchasing the Oracle Hospitality Integration Cloud Service through the Oracle
        Store... Partner Registration Cost Price Quote (CPQ) form - If you are unable to onboard through the Oracle
        Store, you can onboard by submitting the partner registration (CPQ) form.'
      note: Checkout requires the buyer to "agree to the terms and conditions of the Cloud Service Agreement".
    - source: https://docs.oracle.com/cd/F29336_01/doc.201/f27480/t_registering_an_application.htm
      quote: A non production application may not access production environments, so to move from calling non production
        to calling production environments, you must create a new production application. To access production environments,
        please email your Oracle Partner Network (OPN) reference number to hospitality-integrations_ww@oracle.com.
    - source: https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_requesting_a_global_channel_code_for_distribution_apis.htm
      quote: As a global Distribution channel partner, you must obtain a single, global Channel Code to access Oracle
        Hospitality Distribution APIs. This code is issued once per partner and is used globally by any property
        connecting to your channel. ... Oracle Partner Network (OPN) membership and an Oracle Cloud Marketplace
        listing for your integration are required to access customer production environments.
    - source: https://docs.oracle.com/cd/F29336_01/doc.201/f27480/t_signing_in_to_the_developer_portal.htm
      quote: 'When you sign in to the developer portal while in a ''SUSPENDED'' status, you can... View applications,
        but you cannot: Create new applications. Change the application key on an application... View the application
        key. ... When a Suspended Partner Service is Resumed: ... The only exception is the application key is regenerated.
        Partners must update their applications to use the regenerated application key.'
      note: 'Suspension is the closest thing to a published revocation clause: access to the application key is
        withdrawn, and on resumption the key is rotated, forcing a partner code change.'
    - source: https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_limits.htm
      quote: Up to 50 requests per second are allowed per gateway, shared by all consumers and clients accessing
        that gateway. ... Only one client can be connected to consume events from a single chain in a single gateway
        on a single application key. ... The maximum number of applications that can be registered in the OHIP Developer
        portal is 100.
      note: A shared per-gateway rate budget means a property's integrations compete with each other for throughput
        - a structural cost of running many vendors against one OPERA tenant.
    - source: https://docs.oracle.com/cd/F29336_01/doc.201/f27480/c_early_adopter_api_program.htm
      quote: our aim is to avoid breaking changes in v.0 APIs, however we cannot guarantee full backward compatibility...
        the best endeavors assistance provided by product management as part of the program is not subject to service
        level agreements (SLAs); however, we do offer a premium (paid) service for partners and/or customers who
        desire dedicated support.
    - source: https://www.oracle.com/legal/terms.html
      quote: termsOfService declared in every harvested specification (info.termsOfService).
    - source: https://oss.oracle.com/licenses/upl
      quote: This document and all content within is available under the Universal Permissive License v 1.0 - appended
        by Oracle to the info.description of every harvested specification. The specifications themselves are unencumbered;
        the service they describe is not.
    notPublished:
    - Minimum contract term for Oracle Hospitality Integration Cloud Service
    - Exclusivity or full-content style obligations
    - Per-transaction, per-reservation or per-segment fees (call usage alerts exist, but no published price)
    - Termination notice period and post-termination data-retrieval window
    - Any commitment on how long a departing customer retains OPERA data access
    summary: 'What is verifiable: you buy a subscription and accept the Oracle Cloud Service Agreement; production
      access is conditioned on Oracle Partner Network membership; distribution access is conditioned on an Oracle-issued
      Channel Code plus an Oracle Cloud Marketplace listing; suspension revokes key access and rotates the key on
      resumption. Commercial terms - price, term, notice, exclusivity - are not published and are not inferred here.'
  accessGate:
    value: commercial-agreement
    whatADeveloperMustDo:
    - 'Partner path: purchase Oracle Hospitality Integration Cloud Service via the Oracle Store (or submit a partner
      registration CPQ form obtained from hospitality-integrations_ww@oracle.com), accept the Oracle Cloud Service
      Agreement, and complete OCI Cloud Account Activation.'
    - 'Hotelier path: OPERA Cloud Foundation includes OHIP access; an administrator creates the Developer Portal
      Access role / assigns OHIPADMIN, and the portal URL arrives by email on provisioning.'
    - Register an application in the Developer Portal, receive an application key (x-app-key), add an environment
      to obtain clientId, clientSecret, EnterpriseID, Scope and gateway URL.
    - 'For production: email an Oracle Partner Network reference number to hospitality-integrations_ww@oracle.com;
      customer production applications also require a written Business Justification and confirmation of the Oracle
      Terms & Conditions.'
    - 'For Distribution APIs: email hgbu_distribution_partner_rqs_grp@oracle.com for a global Channel Code (5 business
      day acknowledgement), then hold OPN membership and publish an Oracle Cloud Marketplace listing before touching
      customer production environments.'
    - 'For Business Events streaming from a customer environment: the environment owner must approve the subscription
      in their own Developer Portal.'
    whatIsFreeAndPublic:
    - 59 Swagger 2.0 specifications, UPL-1.0, https://github.com/oracle/hospitality-api-docs
    - Postman collections and workspace, https://www.postman.com/hospitalityapis/oracle-hospitality-apis/overview
    - The complete OHIP developer guide, https://docs.oracle.com/cd/F29336_01/doc.201/f27480/
    - A shared partner sandbox (cross-tenant, only after onboarding)
  distributionModel:
    value: channel-manager
    assessment: OPERA Cloud Distribution is the ARI switch between a property and its channels. Availability, rates
      and inventory are pushed outward as OTA-shaped notification messages (ARI Publication API) and reservations
      come back inbound (Distribution Reservation Service, Book, Shop, Reservation Notification). The OPERA Cloud
      Channel Configuration API (openapi/oracle-hospitality-property-v1-chl.json, 138 operations) manages channel,
      availability and inventory mapping with external system subtypes documented as "GDS, WEB, etc." Oracle does
      not publish a count of connected channels or a public channel directory; the only public statement about channel
      scope is that a Channel Code "is issued once per partner and is used globally by any property connecting to
      your channel."
    ndcPosture: Not applicable - hospitality technology, not airline distribution. No IATA NDC certification, NDC
      API or NDC reference was found anywhere in the 59 harvested specifications or the OHIP guide; apparent NDC
      string matches in the corpus were substring false positives.
