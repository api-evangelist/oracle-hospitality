          type: string
          minLength: 0
          maxLength: 20
        preferenceGroup:
          description: Specifies the preference group the Exclusive preference belongs to.
          type: string
          minLength: 0
          maxLength: 20
        preferenceCodes:
          description: Specifies the preference codes mapped to the exclusive preference.
