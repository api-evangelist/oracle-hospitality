components:
  schemas:
    configHotelExclusivePreferencesType:
      type: array
      description: This gives detailed information about a Exclusive preference at the property level.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/configHotelExclusivePreferenceType'
    addressFormatType:
      type: object
      description: A representation of the information contained by an address format.
      properties:
        formatCode:
          description: Address format code.
          type: string
          minLength: 0
          maxLength: 20
        formatDefinition:
          description: Address format definition with the elements of the address.
          type: string
          minLength: 0
          maxLength: 2000
        description:
          description: Description of the address format.
          type: string
          minLength: 0
          maxLength: 200
        displayOrder:
          description: sequence number of the address format.
          type: number
        formattedExample:
          description: An example address formatted with the current format definition.
          type: string
          minLength: 0
          maxLength: 2000
        salesFormat:
          description: Determines if the format is a sales format or not.
          type: boolean
        canDelete:
          description: Determines whether this address format can be deleted.
          type: boolean
        managedBy:
          $ref: '#/components/schemas/managedByOptions'
    claimAdjustmentLimitsInfo:
      type: object
      description: Response object for fetching Claim Adjustment Limits.
      properties:
        claimAdjustmentLimits:
          description: Collection of Claim Adjustment Limits.
          $ref: '#/components/schemas/claimAdjustmentLimitsType'
