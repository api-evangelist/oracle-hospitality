        required: true
        description: ''
        schema:
          type: string
          maxLength: 2000
          minLength: 1
      - name: includeAllAssignedTasks
        in: query
        required: false
        description: This flag, if true, enables fetching statistics for all the housekeeping tasks assigned.
        schema:
          type: boolean
          default: true
      - name: includeTaskSheetsDetails
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: taskCode
