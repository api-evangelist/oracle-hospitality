        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    ratePlanSchedulesSyncType:
      type: object
      description: 'Provide syncMode and corresponding required identifiers. Validation: SINGLE_SCHEDULE_TO_ALL_BASE_RATES requires ratePlanCode + rateSetId + parentRateSetAction. ALL_SCHEDULES_TO_ONE_BASE_RATE requires baseRateCode.'
      properties:
        syncMode:
          type: string
          enum:
          - SINGLE_SCHEDULE_TO_ALL_BASE_RATES
          - ALL_SCHEDULES_TO_ONE_BASE_RATE
          description: 'SINGLE_SCHEDULE_TO_ALL_BASE_RATES: Sync one selected schedule from the given rate plan to all linked base rates. ALL_SCHEDULES_TO_ONE_BASE_RATE: Sync all schedules from the given rate plan to one specified linked base rate.'
        ratePlanCode:
          description: The standard rate plan code whose schedules are to be synced (required when syncMode=SINGLE_SCHEDULE_TO_ALL_BASE_RATES).
          type: string
          minLength: 1
          maxLength: 20
        rateSetId:
          description: Identifier for the rate schedule to sync (required when syncMode=SINGLE_SCHEDULE_TO_ALL_BASE_RATES).
          type: integer
        parentRateSetAction:
          description: Action applied on the parent (standard) rate set before syncing to base rates (required when syncMode=SINGLE_SCHEDULE_TO_ALL_BASE_RATES).
          type: string
          enum:
          - NEW
          - UPDATE
        baseRateCode:
          type: string
          description: Linked base rate code where pricing schedules will be synced to (required when syncMode=ALL_SCHEDULES_TO_ONE_BASE_RATE).
      required:
      - syncMode
    bestAvailableRatePlansStatus:
      type: object
      description: Response for configured best available rate plans status.
      properties:
        warnings:
          description: List of warnings that occurred.
          $ref: '#/components/schemas/warningsType'
        links:
          $ref: '#/components/schemas/links'
