          description: Modify Rate Plan Room Types Status.
          enum:
          - Success
          - Fail
        outcomeMessages:
          description: Status of the update
          maxItems: 4000
          items:
            $ref: '#/components/schemas/outcomeMessageType'
    rateByAgeBucketsType:
