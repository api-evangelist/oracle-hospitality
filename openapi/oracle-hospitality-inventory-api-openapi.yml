components:
  schemas:
    channelSellLimitType:
      type: object
      properties:
        numberOfRooms:
          description: Number of rooms that can be sold for this particular sell limit date.
          type: integer
        bookingChannelCode:
          description: Channel for which this sell limit is applicable.
          type: string
          minLength: 0
          maxLength: 20
        date:
          description: Date on which this sell limit is applicable.
          type: string
          format: date
          maxLength: 8
    channelSellLimitsByDate:
      type: object
      description: Request object to create or update sell limits for the channel or channel room type by day. Advanced logic is implemented to combine consecutive blocks of sell limits into a single schedule which have the same limits configured. Existing schedules can also be split as needed to account for overlapping schedules.
      properties:
        sellLimits:
          description: Collection of sell limits to be created or updated for the channel or channel room type and a particular day.
          $ref: '#/components/schemas/channelSellLimitsByDateType'
        adjustOverlappingSchedules:
          description: Flag to indicate whether any overlapping schedules should be automatically adjusted (split, truncated, etc.) as needed.
          type: boolean
        warnings:
          $ref: '#/components/schemas/warningsType'
    channelSellLimitsByDateType:
      type: object
      description: Collection of sell limits for a channel or channel room type structured by day.
      properties:
        channelSellLimits:
          description: Details about the sell limit for this particular resort, channel, and date.
          type: array
          maxItems: 4000
          items:
            $ref: '#/components/schemas/channelSellLimitType'
        channelRoomTypeSellLimits:
          description: Details about the sell limit for this particular resort, channel, channel room type, and date.
          type: array
          maxItems: 4000
          items:
            type: object
            properties:
              numberOfRooms:
                description: Number of rooms that can be sold for this particular sell limit date.
                type: integer
              bookingChannelCode:
                description: Channel for which this sell limit is applicable.
                type: string
                minLength: 0
                maxLength: 20
              date:
                description: Date on which this sell limit is applicable.
                type: string
                format: date
                maxLength: 8
              channelRoomType:
                description: Channel room type for which this sell limit is applicable.
                type: string
                minLength: 0
                maxLength: 20
        hotelId:
          description: Hotel under which the channel sell limits are applicable.
          type: string
          minLength: 0
          maxLength: 20
    timeSpanDaysOfWeekType:
      type: object
      description: Container for Time span with days of week.
      properties:
        timeSpan:
          $ref: '#/components/schemas/timeSpanType'
        sunday:
          type: boolean
        monday:
          type: boolean
        tuesday:
          type: boolean
        wednesday:
          type: boolean
        thursday:
          type: boolean
        friday:
          type: boolean
        saturday:
          type: boolean
    instanceLink:
      type: object
      description: Metadata describing link description objects that MAY appear in the JSON instance representation.
      properties:
        href:
          description: URI [RFC3986] or URI Template [RFC6570]. If the value is set to URI Template, then the "templated" property must be set to true.
          type: string
        rel:
          description: Name of the link relation that, in addition to the type property, can be used to retrieve link details. For example, href or profile.
          type: string
        templated:
          description: Boolean flag that specifies that "href" property is a URI or URI Template. If the property is a URI template, set this value to true. By default, this value is false.
          type: boolean
          default: false
        method:
          description: HTTP method for requesting the target of the link.
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
          - HEAD
        targetSchema:
          description: Link to the metadata of the resource, such as JSON-schema, that describes the resource expected when dereferencing the target resource..
          type: string
        operationId:
          description: The operationId of the path you can call to follow this link.  This allows you to look up not only the path and method, but the description of that path and any parameters you need to supply.
          type: string
        title:
          description: Exact copy of the "summary" field on the linked operation.
          type: string
    errorInstance:
      title: Error Instance Details
      description: Complex type that contains error instance details for a REST call.
      type: object
      properties:
        type:
          type: string
          description: Absolute URI [RFC3986] that identifies the problem type.  When dereferenced, it SHOULD provide a human-readable summary of the problem (for example, using HTML).
        title:
          type: string
          description: Short, human-readable summary of the problem.  The summary SHOULD NOT change for subsequent occurrences of the problem, except for purposes of localization.
        status:
          type: integer
          description: HTTP status code for this occurrence of the problem, set by the origin server.
        detail:
          type: string
          description: Human-readable description specific to this occurrence of the problem.
        instance:
          type: string
          description: Absolute URI that identifies the specific occurrence of the problem.  It may or may not provide additional information if dereferenced.
        o:errorCode:
          type: string
          description: Application error code, which is different from HTTP error code.
        o:errorPath:
          type: string
          description: Path to the problem at the resource or property level.
      required:
      - type
      - title
    warningType:
      type: object
      description: Used when a message has been successfully processed to report any warnings or business errors that occurred.
      properties:
        value:
          type: string
          description: Property Value
        shortText:
          description: An abbreviated version of the error in textual format.
          type: string
          maxLength: 2000
        code:
          description: If present, this refers to a table of coded values exchanged between applications to identify errors or warnings.
          type: string
          minLength: 0
          maxLength: 20
        docURL:
          description: If present, this URL refers to an online description of the error that occurred.
          type: string
          maxLength: 2000
        status:
          description: If present, recommended values are those enumerated in the ErrorRS, (NotProcessed Incomplete Complete Unknown) however, the data type is designated as string data, recognizing that trading partners may identify additional status conditions not included in the enumeration.
          type: string
          maxLength: 2000
        tag:
          description: If present, this attribute may identify an unknown or misspelled tag that caused an error in processing. It is recommended that the Tag attribute use XPath notation to identify the location of a tag in the event that more than one tag of the same name is present in the document. Alternatively, the tag name alone can be used to identify missing data [Type=ReqFieldMissing].
          type: string
          maxLength: 2000
        recordId:
          description: If present, this attribute allows for batch processing and the identification of the record that failed amongst a group of records. This value may contain a concatenation of a unique failed transaction ID with specific record(s) associated with that transaction.
          type: string
          maxLength: 2000
        type:
          description: The Warning element MUST contain the Type attribute that uses a recommended set of values to indicate the warning type. The validating XSD can expect to accept values that it has NOT been explicitly coded for and process them by using Type ="Unknown".
          type: string
          minLength: 0
          maxLength: 20
        language:
          description: Language identification.
          type: string
          pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
        rph:
          description: Reference Place Holder used as an index for this warning.
          type: string
          minLength: 1
          maxLength: 8
    channelSellLimitSchedulesType:
      type: array
      description: Details about a sell limit schedule for a channel or channel room type.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/channelSellLimitScheduleType'
    exceptionDetailType:
      title: Error Detail
      description: Complex type that contains error details for a REST call.
      type: object
      properties:
        type:
          type: string
          description: Absolute URI [RFC3986] that identifies the problem type.  When dereferenced, it SHOULD provide a human-readable summary of the problem (for example, using HTML).
        title:
          type: string
          description: Short, human-readable summary of the problem.  The summary SHOULD NOT change for subsequent occurrences of the problem, except for purposes of localization.
        status:
          type: integer
          description: HTTP status code for this occurrence of the problem, set by the origin server.
        detail:
          type: string
          description: Human-readable description specific to this occurrence of the problem.
        instance:
          type: string
          description: Absolute URI that identifies the specific occurrence of the problem.  It may or may not provide additional information if dereferenced.
        o:errorCode:
          type: string
          description: Application error code, which is different from HTTP error code.
        o:errorPath:
          type: string
          description: Path to the problem at the resource or property level.
        o:errorDetails:
          description: Details of the error message, consisting of a hierarchical tree structure.
          type: array
          items:
            $ref: '#/components/schemas/errorInstance'
        links:
          $ref: '#/components/schemas/links'
      required:
      - type
      - title
    channelSellLimits:
      type: object
      description: Response object containing sell limit schedules set for the channel or channel room type.
      properties:
        sellLimits:
          description: List of sell limit schedules configured for the requested channel or channel room type.
          $ref: '#/components/schemas/channelSellLimitSchedulesType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    status:
      type: object
      description: Response Body.
      properties:
        warnings:
          $ref: '#/components/schemas/warningsType'
        links:
          $ref: '#/components/schemas/links'
    channelSellLimitsByDateRange:
      type: object
      description: Request object to create or update sell limit schedules for the channel or channel room type within a date range. Existing schedules can be split as needed to account for overlapping schedules.
      properties:
        sellLimits:
          description: List of sell limit schedules to be created or updated for the channel or channel room type.
          $ref: '#/components/schemas/channelSellLimitSchedulesType'
        adjustOverlappingSchedules:
          description: Flag to indicate whether any overlapping schedules should be automatically adjusted (split, truncated, etc.) as needed.
          type: boolean
        warnings:
          $ref: '#/components/schemas/warningsType'
    channelSellLimitScheduleType:
      type: object
      description: Details about a sell limit schedule for a channel or channel room type.
      properties:
        sellLimitId:
          description: Unique identifier for the channel sell limit.
          $ref: '#/components/schemas/uniqueID_Type'
        hotelId:
          description: Hotel for which the sell limit schedule is applicable.
          type: string
          minLength: 0
          maxLength: 20
        bookingChannelCode:
          description: Channel for which the sell limit schedule is applicable.
          type: string
          minLength: 0
          maxLength: 20
        channelRoomType:
          description: Channel room type for which the sell limit schedule is applicable.
          type: string
          minLength: 0
          maxLength: 20
        dateRange:
          description: Sell limit schedule begin and end dates as well as which days of the week the limit applies to.
          $ref: '#/components/schemas/timeSpanDaysOfWeekType'
        numberOfRooms:
          description: Number of rooms which can be sold under the hotel, channel, and channel room type combination for the specified date range.
          type: integer
    timeSpanType:
      type: object
      description: Allows for a choice in description of the amount of time spanned by this type. EndDate specifies a specific date, while Duration provides a measure of time to add to the StartDate to yield end date.
      properties:
        startDate:
          type: string
          format: date
          maxLength: 8
        endDate:
          type: string
          format: date
          maxLength: 8
        duration:
          type: string
    warningsType:
      type: array
      description: Used in conjunction with the Success element to define a business error.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/warningType'
    links:
      type: array
      items:
        $ref: '#/components/schemas/instanceLink'
    uniqueID_Type:
      type: object
      description: An identifier used to uniquely reference an object in a system (e.g. an airline reservation reference, customer profile reference, booking confirmation number, or a reference to a previous availability quote).
      properties:
        id:
          description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          type: string
          minLength: 0
          maxLength: 80
        type:
          description: A reference to the type of object defined by the UniqueID element.
          type: string
          minLength: 0
          maxLength: 40
    sellLimitByRange:
      type: object
      description: A Request message that sets sell limit for collection of date ranges for either of the levels House, room type or room class. You can specify the days of the week, number type group and the date range as part of the request.
      properties:
        sellLimitsByDateRange:
          description: Contains the sell limits for a given date range to be set.
          type: array
          items:
            $ref: '#/components/schemas/sellLimitByDateRangeType'
        warnings:
          $ref: '#/components/schemas/warningsType'
    hotelInventoryType:
      type: object
      description: A collection of Reservation objects and Unique IDs of Reservation.
      properties:
        houseInventory:
          description: Collection of House level Inventory counts for the date ranges.
          $ref: '#/components/schemas/inventoryCountsListType'
        roomTypeInventories:
          description: Collection of Room type level Inventory counts for the date ranges.
          type: array
          maxItems: 4000
          items:
            $ref: '#/components/schemas/inventoryLevelCountsListType'
        roomClassInventories:
          description: Collection of Room Class level Inventory counts for the date ranges.
          type: array
          maxItems: 4000
          items:
            $ref: '#/components/schemas/inventoryLevelCountsListType'
    sellLimit:
      type: object
      description: A Request message that sets sell limit for a particular date for all the levels House, room type and room class. The request can contain the number type in which the sell limits is to be fetched for the different levels.
      properties:
        sellLimitsByDate:
          description: Contains the sell limits that are being updated (Updates can be at House level, Room Class or Room Type levels).
          $ref: '#/components/schemas/sellLimitByDateType'
        warnings:
          $ref: '#/components/schemas/warningsType'
    heldByType:
      type: string
      description: Type of the entity that is requesting for the item hold.
      enum:
      - Event
      - Reservation
      - Allotment
    roomCodeCategoryType:
      type: string
      description: Used for Room code type. eg. Code="RoomType" or "RoomClass"
