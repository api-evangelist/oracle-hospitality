components:
  schemas:
    codeDescriptionType:
      type: object
      description: This contains a generic code and description information.
      properties:
        code:
          description: Code.
          type: string
          minLength: 0
          maxLength: 20
        description:
          description: description.
          type: string
          minLength: 0
          maxLength: 2000
    telephoneInfoType:
      type: object
      description: Information on a telephone number for the customer.
      properties:
        telephone:
          description: Phone details for the profile.
          $ref: '#/components/schemas/telephoneType'
        id:
          description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          type: string
          minLength: 0
          maxLength: 80
        type:
          description: A reference to the type of object defined by the UniqueID element.
          type: string
          minLength: 0
          maxLength: 20
    memberAwardDetailsType:
      type: array
      description: Details related to member award per stay date.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/memberAwardDetailType'
    identificationType:
      type: object
      description: Identification information of the customer.
      properties:
        idType:
          description: Identification Type. Eg Passport, Driving License etc.
          type: string
          minLength: 0
          maxLength: 40
        idNumber:
          description: Identification Number.
          type: string
          minLength: 0
          maxLength: 80
        idNumberMasked:
          description: Masked Identification Number.
          type: string
          minLength: 0
          maxLength: 80
        issuedCountry:
          description: The country where Identification was issued.
          type: string
          minLength: 0
          maxLength: 20
        issuedDate:
          description: Issued date of Identification.
          type: string
          format: date
        issuedPlace:
          description: The place where Identification was issued.
          type: string
          minLength: 0
          maxLength: 80
        expirationDate:
          description: Expiration date of Identification.
          type: string
          format: date
        registeredProperty:
          description: Property where the identification belongs to.
          type: string
          minLength: 0
          maxLength: 20
        primaryInd:
          description: When true, indicates a primary information.
          type: boolean
        orderSequence:
          description: Display Order sequence.
          type: number
    cardReIssueType:
      type: string
      description: Request to re issue a new card.
      enum:
      - Pending
      - NotApplicable
      - Requested
    memberAwardType:
      type: object
      properties:
        profileIdList:
          description: Unique identifiers for the Profile for both internal and external systems.
          $ref: '#/components/schemas/profileIdList'
        membershipType:
          description: The type of the membership.
          type: string
          minLength: 0
          maxLength: 20
        membershipCardNo:
          description: The card number associated with this membership.
          type: string
          minLength: 0
          maxLength: 50
        membershipLevel:
          description: The current level of the membership.
          type: string
          minLength: 0
          maxLength: 20
        reservationIdList:
          description: Unique identifiers for the Reservation like Confirmation Number.
          $ref: '#/components/schemas/reservationIdList'
        adults:
          description: Number of adults associated with the reservation.
          type: integer
        reservationTimeSpan:
          description: Arrival and Departure dates of the reservation.
          $ref: '#/components/schemas/timeSpanType'
        memberPointsBefore:
          description: Member points before award transaction.
          type: integer
        memberPointsAfter:
          description: Member points after award transaction.
          type: integer
        awardPoints:
          description: Points associated with the award.
          type: integer
        cancelPointsReturn:
          description: Number of cancel points returned.
          type: integer
        actualCancelPoints:
          description: Actual number of cancel points.
          type: integer
        expiryPoints:
          description: Points that will expire.
          type: integer
        awardProcessType:
          description: Processing type of the award like Actual , Projected or Inactive.
          $ref: '#/components/schemas/memberAwardProcessType'
        memberAwardDetails:
          description: Details related to member award per stay date.
          $ref: '#/components/schemas/memberAwardDetailsType'
        hotelId:
          description: Property associated with the reservation.
          type: string
          minLength: 0
          maxLength: 20
    keywordDetailType:
      type: object
      properties:
        newKeyword:
          description: The new keyword value.
          type: string
          minLength: 0
          maxLength: 80
    tierAdministrationType:
      type: string
      description: Do not upgrade membership. The membership may be downgraded.
      enum:
      - Disabled
      - NoUpgrade
    benefitsType:
      type: array
      description: Basic information about membership benefit.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/benefitType'
    countryNameType:
      type: object
      description: Code for a country or a nationality.
      properties:
        value:
          type: string
          description: Used for Character Strings, length 0 to 200.
          minLength: 0
          maxLength: 200
        code:
          description: Code for a country or a nationality.
          type: string
          minLength: 0
          maxLength: 20
    instanceLink:
      type: object
      description: Metadata describing link description objects that MAY appear in the JSON instance representation.
      properties:
        href:
          description: URI [RFC3986] or URI Template [RFC6570]. If the value is set to URI Template, then the "templated" property must be set to true.
          type: string
        rel:
          description: Name of the link relation that, in addition to the type property, can be used to retrieve link details. For example, href or profile.
          type: string
        templated:
          description: Boolean flag that specifies that "href" property is a URI or URI Template. If the property is a URI template, set this value to true. By default, this value is false.
          type: boolean
          default: false
        method:
          description: HTTP method for requesting the target of the link.
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
          - HEAD
        targetSchema:
          description: Link to the metadata of the resource, such as JSON-schema, that describes the resource expected when dereferencing the target resource..
          type: string
        operationId:
          description: The operationId of the path you can call to follow this link.  This allows you to look up not only the path and method, but the description of that path and any parameters you need to supply.
          type: string
        title:
          description: Exact copy of the "summary" field on the linked operation.
          type: string
    memberInfoDetailsType:
      type: object
      properties:
        guestTotalNights:
          description: Total nights of the guest.
          type: integer
        guestTotalStay:
          description: STotal stays of the guest.
          type: integer
        tierBaseNights:
          description: Tier Base Nights Points.
          type: integer
        tierBaseRevenue:
          description: Tier Base Revenue Points.
          type: number
        tierBaseStay:
          description: Tier Base Stay Points.
          type: integer
        tierBonusNights:
          description: Tier Bonus Nights Points.
          type: integer
        tierBonusRevenue:
          description: Tier Bonus Revenue Points.
          type: number
        tierBonusStay:
          description: Tier Bonus Stay Points.
          type: integer
        membershipTotalNights:
          description: Total Nights of the membership.
          type: integer
        membershipTotalStay:
          description: Total Stay of the membership.
          type: integer
        awardBasePoints:
          description: Total base points of the award.
          type: integer
        awardBonusPoints:
          description: Total bonus points of the award.
          type: integer
        awardMiscPoints:
          description: Total miscellaneous points of the award.
