      - name: fileName
        in: query
        required: false
        description: File name if payment method is EFT.
        schema:
          type: string
      - name: payee
        in: query
        required: false
        description: File name if payment method is EFT.
        schema:
          type: string
      - name: checkNo
        in: query
        required: false
        description: Check no of payment.
        schema:
          type: number
      - name: status
        in: query
        description: Simple type for payment activity status type. Valid values are Outstanding, Reconciled, Unpresented and Void.
        required: false
        style: form
        explode: true
        schema:
