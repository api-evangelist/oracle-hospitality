          example: true
        currencyCode:
          type: string
          description: currency code
          example: EUR
    Communications:
      type: object
      properties:
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
          minItems: 1
        emails:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        urls:
          type: array
          items:
            $ref: '#/components/schemas/Url'
  responses:
    '406':
      description: Not acceptable.
    '414':
      description: Request URI Too Large
    '503':
      description: Service Unavailable
    '413':
      description: Request Entity Too Large
    '500':
      description: System Error
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ExceptionObj'
    '400':
      description: Bad Request
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ExceptionObj'
    '502':
      description: Bad Gateway
    '403':
      description: Forbidden
    '415':
      description: Unsupported Media Type
    '404':
      description: Resource not found
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ExceptionObj'
    '401':
      description: Unauthorized
    '405':
      description: Method not allowed
  parameters:
    confirmationNumberPath:
      name: confirmationNum
      description: OPERA Confirmation Number
      in: path
      required: true
      x-example: '89786934'
      schema:
        type: string
        minLength: 1
    x-tracing-key:
      name: x-hdp-tracing-key
      in: header
      description: Unique tracing key e.g. 4664ab3423434a45
      required: true
      x-example: 4664ab3423434a45
      schema:
        type: string
    authKey:
      name: authorization
      in: header
      description: Bearer token that needs to be passed which is generated post user authentication
      required: true
      schema:
        type: string
    idExtension:
      name: idExtension
      description: This is the index number for multi leg reservations. Numeric values only.
      in: query
      required: false
      x-example: '1'
      schema:
        type: string
        minLength: 1
    Accept-Language:
      name: Accept-Language
      description: Language code
      in: header
      schema:
        type: string
        pattern: \s*([a-z]{2})(?:-[A-Z]{2})?(?:\s*;q=([0-9]\.[0-9]))?(?:\s*,|$)
    hotelCodePath:
      name: hotelCode
      description: The unique identifier of the Property in Channel system.
      in: path
      required: true
      x-example: XUSXXYY99
      schema:
        type: string
        minLength: 1
    x-originating-application:
      name: x-originating-application
      description: Customer's Integration Application Id
      in: header
      schema:
        type: string
    appKey:
      name: x-app-key
      in: header
      description: OHIP Partner
      required: false
      schema:
        type: string
        pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$
    x-request-id:
      name: x-request-id
      description: Unique tracing key e.g. 4664ab3423434a45
      in: header
      x-example: 4664ab3423434a45
      schema:
        type: string
    channelCodeHeader:
      name: x-channelCode
      in: header
      description: Channel code.
      required: true
      x-example: CH1
      schema:
        type: string
        pattern: ^[a-zA-Z0-9]*$
externalDocs:
