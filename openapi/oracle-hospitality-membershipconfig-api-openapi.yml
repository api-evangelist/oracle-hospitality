        in: query
        required: false
        description: Membership type
        schema:
          type: string
      - name: code
        in: query
        required: false
        description: Benefit Code
        schema:
          type: string
      - name: end
        in: query
        required: false
        description: The ending value of the date range.
        schema:
          type: string
          format: date
      - name: start
        in: query
        required: false
        description: The starting value of the date range.
        schema:
          type: string
          format: date
      - name: minimumLevel
        in: query
        required: false
        description: Min value for membership level. This is the minimum membership level member gets for enrolling into this program.
        schema:
          type: string
      - name: includeInactive
        in: query
        required: false
        description: Flag to decide whether or not to include inactive records in search result set.
