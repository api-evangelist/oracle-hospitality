components:
  schemas:
    membershipRevenueTypeType:
      type: object
      description: Base type provides information about Membership Market/Property Groups Configuration.
      properties:
        code:
          description: Code is used to identify a Membership Market/Resort Group.
          type: string
          minLength: 0
          maxLength: 20
        description:
          description: Description of the Membership Market/Propety Group.
          type: string
          minLength: 0
          maxLength: 2000
        displaySequence:
          description: Membership Market/Property Groups display sequence Number
          type: number
        label:
          description: Label of the membership revenue type.
          type: string
          minLength: 0
          maxLength: 20
        exportBucketCode:
          description: Revenue bucket code that is associated to the membership revenue type.
          type: string
          minLength: 0
          maxLength: 20
        managedBy:
          $ref: '#/components/schemas/managedByOptions'
    membershipLevels:
      type: object
      description: Request object for modifying membership levels.
      properties:
        membershipLevels:
          description: Collection of membership levels to be changed.
          $ref: '#/components/schemas/membershipLevelsType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    membershipRevenueTypesInfoType:
      type: array
      description: Membership revenue type code and description.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/codeDescriptionType'
    membershipLevelRules:
      type: object
      description: Request object for modifying Membership Level Rules.
      properties:
        membershipLevelRules:
          description: Collection of Membership Level Rules to be changed.
          $ref: '#/components/schemas/membershipLevelRulesType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    cardRangeType:
      type: object
      description: Card number start and end range.
      properties:
        from:
          description: Starting range of the card.
          type: string
          minLength: 0
          maxLength: 50
        to:
          description: End range of the card.
          type: string
          minLength: 0
          maxLength: 50
    membershipFolioTexts:
      type: object
      description: Collection of FolioTexts to be inserted at MembershipLevel.
      properties:
        membershipFolioTexts:
          type: array
          items:
            $ref: '#/components/schemas/membershipFolioTextsType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    upgradeDowngradeForCalendarPeriodType:
      type: string
      description: Calculate points from five Years
      enum:
      - ThisYear
      - LastYear
      - TwoYears
      - ThreeYears
      - FourYears
      - FiveYears
    suspendedMatchRuleType:
      type: object
      description: Provides information about the Suspended Profile Match Rule Configuration.
      properties:
        region:
          description: Region to filter by based on the profile region setup
          type: string
        nameType:
          description: Name type to filter match rules
          type: string
        validationItem:
          description: Validation item for the rule
          type: string
        validationType:
          description: Validation type for the rule
          type: string
        validationValue:
          description: Validation value for the rule
          type: string
        applyRuleYn:
          description: The activation flag for the match rule
          type: boolean
        userMaintainable:
          description: Whether the rule is maintainable by users
          type: boolean
    membershipTypeRulePrimaryDetailsType:
      type: object
      description: Membership Type rule primary information.
      properties:
        membershipTypeRuleId:
          description: Membership type rule ID details.
          $ref: '#/components/schemas/membershipTypeRuleIDType'
        description:
          description: Description of the rule.
          type: string
          minLength: 0
          maxLength: 2000
        ruleBasedOn:
          description: Calculation rule name of the type rule. Determines whether this Membership generates points based on guest Revenue, Stays, Nights, Enrolment.
          $ref: '#/components/schemas/membershipTypeRuleBasedOnType'
        ruleStartDate:
          description: Start date indicates the begin date for this points calculation rule.
          type: string
          format: date
          maxLength: 8
        ruleEndDate:
          description: End date for this points calculation rule.
          type: string
          format: date
          maxLength: 8
        pointsType:
          description: Specifies if points are BASE or BONUS.
          $ref: '#/components/schemas/rulePointsTypeType'
        inactiveDate:
          description: The date that Membership type rule is marked as inactive.
          type: string
          format: date
          maxLength: 8
        transactionCode:
          description: Tranaction code for membership type rule. e.g. Resident, Non Resident
          $ref: '#/components/schemas/membershipTypeRuleTransactionCodeType'
    membershipEnrollmentCodesInfoType:
      type: array
      description: Membership enrollment code code and description.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/codeDescriptionType'
    profileRegionType:
      type: object
      description: Provides information about the Profile Regions Configuration.
      properties:
        region:
          description: Region to filter by based on the profile region setup
          type: string
        type:
          description: Type to filter profile regions
          type: string
        description:
          description: Description for the profile region
          type: string
        hotelIds:
          description: Resorts to be created for the corresponding Profile Region.
          type: array
          maxItems: 4000
          items:
            type: string
            minLength: 0
            maxLength: 20
    membershipRoomGroups:
      type: object
      description: Request object for changing membership room groups.
      properties:
        membershipRoomGroups:
          description: Collection of membership room groups to be changed.
          $ref: '#/components/schemas/membershipRoomGroupsType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    colorType:
      type: string
      description: Color configuration type. This color configuration provides a visual category of entities.
      enum:
      - Red
      - DarkRed
      - Green
      - DarkGreen
      - LightGreen
      - Orange
      - White
      - Yellow
      - DarkYellow
      - Purple
      - Brown
      - Gray
      - Aqua
      - Chocolate
      - Blue
      - LightBlue
      - DarkBlue
      - Cyan
      - DarkCyan
      - Magenta
      - DarkMagenta
      - Black
      - Deepteal
      - Sunsetorange
      - Aquasky
      - Mochabrown
      - Mossgreen
      - Rosewood
      - Claybrown
      - Softlavender
      - Olivegold
      - Plumpurple
      - Mistblue
      - Forestgreen
      - Dustyviolet
      - Oceanblue
      - Copper
    membershipLevelType:
      type: object
      description: A Type that holds key values, that uniquely identifies a membership level
      properties:
        type:
          description: Membership type
          type: string
          minLength: 0
          maxLength: 20
        code:
          description: Membership level
          type: string
          minLength: 0
          maxLength: 20
        description:
          description: Description of the Membership level.
          type: string
          minLength: 0
          maxLength: 2000
        label:
          description: Label of the Membership level.
          type: string
          minLength: 0
          maxLength: 40
        rank:
          description: Rank of Membership level.
          type: number
        vip:
          description: VIP level associated to the Membership level.
          type: string
          minLength: 0
          maxLength: 20
        displayColor:
          description: Display Colour of Membership level.
          $ref: '#/components/schemas/colorType'
        inactive:
          description: Inactive flag for a Membership level.
          type: boolean
        folioTexts:
          description: Folio text for a specific membership type level for hotels in the chain.
          $ref: '#/components/schemas/hotelFolioTextsType'
        fulfillment:
          description: Indicates whether memberships upgraded or downgraded to or from this level will be included in the Membership Export.
          type: boolean
        changesRestricted:
          description: Indicates whether memberships level is restricted to prevent users from making changes to it.
          type: boolean
        autoRenewGrace:
          description: Select the number of graces the member will be allowed before the membership level auto-renews based on the member current points. It is available when the Tier Management Reset option is selected on Membership Type.
          type: integer
        cardValidYears:
          description: Specify the time limit (from 1 to 5 years) for membership card expiration for this level
          type: integer
        restrictedLevel:
          description: Indicates whether memberships level is restricted to prevent users from making changes to it. It is available when the Advanced Enrollment option is selected on Membership Type.
          type: boolean
        renewCard:
          description: Indicates whether membership has expired by the time the membership record is uploaded, the members card will be renewed and updated with a new expiration date.
          type: boolean
        feeRequired:
          description: Indicates whether membership fee payment is required upon upgrade to this membership level.
          type: boolean
        maxDowngradeLevel:
          description: The lowest level in which this level can be downgraded to.
          type: string
          minLength: 0
          maxLength: 20
        numberOfTransactions:
          description: Number of transaction(s) for each stay. Value will be 2 in case of double dipping otherwise it will be null or 1.
          type: integer
        managedBy:
          $ref: '#/components/schemas/managedByOptions'
    cardRangesType:
      type: array
      description: Card number start and end range.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/cardRangeType'
    profileRegionInfo:
      type: object
      description: Object for Profile Region Configuration.
      properties:
        profileRegion:
          description: Profile Region Info for a singular Region.
          $ref: '#/components/schemas/profileRegionType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    membershipMarketGroupType:
