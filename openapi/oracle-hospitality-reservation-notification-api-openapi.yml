components:
  schemas:
    ProfileType:
      type: string
      enum:
      - Guest
      - TravelAgent
      - Source
      - Company
      example: Guest
      description: The type of profile being sent
    ReservationMembership:
      type: object
      description: Details of the membership added to the reservation.
      properties:
        membershipLevel:
          type: string
          example: ENTRY
          description: Code that designates this membership level.
        membershipId:
          type: string
          example: O12345F
          description: The guest's membership ID number
        membershipType:
          type: string
          example: MF
          description: The membership type belonging to the program the guest is enrolled with
      required:
      - membershipId
    ReservationGuestRequest:
      type: object
      description: Reservation Guest Information
      properties:
        profileInfo:
          type: object
          properties:
            profileIdList:
              $ref: '#/components/schemas/ProfileIdListRequest'
            profile:
              $ref: '#/components/schemas/Profile'
          required:
          - profile
        primary:
          type: boolean
          example: true
          description: Indicates if the profile is primary if multiple profiles of the same type are being sent. Should be true by default if only one profile of same type is sent
        arrivalTransport:
          description: Arrival Transport details of the Guest
          $ref: '#/components/schemas/ReservationTransport'
        departureTransport:
          description: Departure Transport details of the Guest
          $ref: '#/components/schemas/ReservationTransport'
      required:
      - profileInfo
    ReservationIdResponse:
      type: object
      properties:
        id:
          type: string
          description: Global reservation number from external channel. Maximum length is 50 alphanumeric characters without spaces.
          example: '5030863'
        type:
          type: string
          description: Type of id
          enum:
          - Others
          - Confirmation
          - Reservation
          example: Others
        idContext:
          type: string
          description: Context of the Id.
          example: CH1
        idExtension:
          type: string
          description: This is the index number for multi leg reservations. Numeric values only.
          example: '1'
    ReservationPayload:
      type: object
      properties:
        lastModifyDateTime:
          type: string
          format: date-time
          description: 'Date and time when this reservation was last updated, including time zone information. Timestamp as defined in ISO 8601 format and always be in the following format: YYYY-MM-DDThh:mm:ssZ (time is UTC).'
          example: '2023-11-17T12:21:00Z'
        roomStay:
          description: List of room stay information including Room Rates, Promotion, Guest Counts and Guarantee
          $ref: '#/components/schemas/RoomStayResponse'
        reservationGuests:
          type: array
          items:
            $ref: '#/components/schemas/ReservationGuestResponse'
          example:
          - profileInfo:
              profile:
                customer:
                  personName:
                  - surname: Smith
                    givenName: Mary
                    middleName: Angel
                    nameTitle: Mr and Mrs
                    nameType: Primary
                    email: customer@example.com
                    phoneNumber: 415.555.0100
                    address:
                      addressLine:
                      - Street 7031 Columbia Gateway Dr.
                      cityName: Columbia
                      postalCode: '21046'
                      country:
                        code: US
                      state: MD
                  language: en-us
                profileType: Guest
            primary: true
            arrivalTransport:
              comments: Comments Area
              type: adf
              transportCode: XXXX
              carrierCode: XXXX
              stationCode: XXXX
              dateTime: '2023-09-17T12:21:00.000Z'
              transportationReqd: true
            departureTransport:
              comments: Comments Area
              type: adf
              transportCode: XXXX
              carrierCode: XXXX
              stationCode: XXXX
              dateTime: '2023-09-17T12:21:00.000Z'
              transportationReqd: true
          - profileInfo:
              profileIdList:
              - id: '12345671'
                idContext: Central
                type: TravelAgent
              profile:
                profileType: TravelAgent
                companyInfo:
                  companyName: Smith Travel
                  email: customer@example.com
                  phoneNumber: 415.555.0100
                  address:
                    addressLine:
                    - Street 7031 Columbia Gateway Dr.
                    cityName: Columbia
                    postalCode: '21046'
                    country:
                      code: US
                    state: MD
            primary: true
          - profileInfo:
              profileIdList:
              - id: '12345672'
                idContext: Central
                type: Source
              profile:
                profileType: Source
                companyInfo:
                  companyName: Smith Travel POS
                  email: customer@example.com
                  phoneNumber: 415.555.0100
                  address:
                    addressLine:
                    - Street 7031 Columbia Gateway Dr.
                    cityName: Columbia
                    postalCode: '21046'
                    country:
                      code: US
                    state: MD
            primary: true
          - profileInfo:
              profileIdList:
              - id: ''
                idContext: Central
                type: Company
              profile:
                profileType: Company
                companyInfo:
                  companyName: Oracle Corporation
                  email: customer@example.com
                  phoneNumber: 415.555.0100
                  address:
                    addressLine:
                    - Street 7031 Columbia Gateway Dr.
                    cityName: Columbia
                    postalCode: '21046'
                    country:
                      code: US
                    state: MD
              primary: true
        reservationPaymentMethods:
          description: Reservation Payment Method details including payment Card details.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentMethod'
        reservationSpecialRequests:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSpecialRequestsResponse'
        reservationPackages:
          description: Details of the Packages added to the reservation.
          type: array
          items:
            $ref: '#/components/schemas/ReservationPackages'
        reservationMemberships:
          type: array
          items:
            $ref: '#/components/schemas/ReservationMembership'
        hotelCode:
          description: The unique identifier of the Property in Channel system.
          type: string
          example: XUSXXYY99
        comments:
          description: Comments associated to the Reservation
          type: array
          items:
            type: object
            properties:
              comment:
                $ref: '#/components/schemas/CommentType'
        reservationStatus:
          type: string
          enum:
          - Reserved
          - ReservedChanged
          - Cancelled
          - OnHold
          example: Reserved
        printRate:
          type: boolean
          description: Defines if the rate is printed on various correspondence. Possible values are 'true' or 'false'.
          example: false
        optedForCommunication:
          type: boolean
          description: Defines if guest agreed to receive correspondence from the property via email, phone, letter, etc. Possible values are 'true' or 'false'.
          example: false
        travelPurpose:
          description: Indicates the purpose of Guest Stay
          type: string
          enum:
          - Leisure
          - Business
      required:
      - roomStay
      - reservationGuests
      - reservationPaymentMethods
    RoomRateResponseGet:
      type: object
      description: The room rate response object for get
      allOf:
      - $ref: '#/components/schemas/InfoRoomRateResponse'
      - type: object
        properties:
          ratePlanInfo:
            type: object
            properties:
              ratePlanType:
                type: string
                description: The rate plan type associated with the rate plan.
                example: 12
              ratePlanName:
                type: string
                description: The name of the rate plan.
                example: Flexible Room Only Rate
              ratePlanLevel:
                type: string
                description: The rate level the rate plan is associated to.
              ratePlanCategory:
                type: string
                description: The rate category the rate plan is associated to.
              identificationRequired:
                type: boolean
                description: Indicates if an ID is required during the Check-In for this rate booking
              gdsDescription:
                $ref: '#/components/schemas/GdsDescription'
              mealPlan:
                description: Type of meal plan the rate plan includes
                type: object
                $ref: '#/components/schemas/MealPlan'
    CancelReservationNotification:
      type: object
      properties:
        reservationIdList:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReservationIdNotification'
        lastModifyDateTime:
          type: string
          format: date-time
          description: 'Date and time when this reservation was last updated, including time zone information. Timestamp as defined in ISO 8601 format and always be in the following format: YYYY-MM-DDThh:mm:ssZ (time is UTC).'
          example: '2023-11-17T12:21:00Z'
        hotelCode:
          description: The unique identifier of the Property in Channel system.
          type: string
          example: XUSXXYY99
        messageId:
          description: Reservation Message Number generated by the requester.
          type: string
          example: '22922909'
      required:
      - reservationIdList
    PaymentCard:
      type: object
      properties:
        cardType:
          description: Type of the Credit Card
          type: string
          example: MC
        cardNumber:
          description: Full Card Number or the Card Token
          type: string
          example: '5105105105105100'
        expirationDate:
          description: Expiration date in format MM/YY
          type: string
          pattern: ^((?:0[1-9]|1[0-2])\/([0-9][0-9])|(?:\d{4})-(?:0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]))$
          example: 06/23
        cardHolderName:
          description: Credit card holder name
          type: string
          example: Mary Smith
        cardNumberMasked:
          description: Masked card number.
          example: XXXXXXXXXXXX0005
          type: string
          minLength: 0
          maxLength: 80
        cardOrToken:
          description: This contains information on whether credit card is tokenized (token enabled). A value of 'Token' indicates cardNumber holds token value and 'CardNumber' indicates cardNumber holds credit card number.
          type: string
          enum:
          - CardNumber
          - Token
        citId:
          type: string
          description: Customer Initiated Transaction(CIT) Id for Credit Cards. This is only used when PAYMENT SERVICES DIRECTIVE (PSD2) Opera Control is active.
          minLength: 0
          maxLength: 16
          example: 654321ABC1234578
      required:
      - cardType
      - cardNumber
      - expirationDate
      - cardHolderName
    ReservationPayloadGet:
      type: object
      properties:
        lastModifyDateTime:
          type: string
          format: date-time
          description: 'Date and time when this reservation was last updated, including time zone information. Timestamp as defined in ISO 8601 format and always be in the following format: YYYY-MM-DDThh:mm:ssZ (time is UTC).'
          example: '2023-11-17T12:21:00Z'
        roomStay:
          description: List of room stay information including Room Rates, Promotion, Guest Counts and Guarantee
          $ref: '#/components/schemas/RoomStayResponseGet'
        reservationGuests:
          type: array
          items:
            $ref: '#/components/schemas/ReservationGuestResponse'
          example:
          - profileInfo:
              profile:
                customer:
                  personName:
                  - surname: Smith
                    givenName: Mary
                    nameTitle: Mr and Mrs
                    middleName: Angel
                    nameType: Primary
                    email: customer@example.com
                    phoneNumber: 415.555.0100
                    address:
                      addressLine:
                      - Street 7031 Columbia Gateway Dr.
                      cityName: Columbia
                      postalCode: '21046'
                      country:
                        code: US
                      state: MD
                  language: en-us
                profileType: Guest
            primary: true
            arrivalTransport:
              comments: Comments Area
              type: adf
              transportCode: XXXX
              carrierCode: XXXX
              stationCode: XXXX
              dateTime: '2023-09-17T12:21:00.000Z'
              transportationReqd: true
            departureTransport:
              comments: Comments Area
              type: adf
              transportCode: XXXX
              carrierCode: XXXX
              stationCode: XXXX
              dateTime: '2023-09-17T12:21:00.000Z'
              transportationReqd: true
          - profileInfo:
              profileIdList:
              - id: '12345671'
                idContext: Central
                type: TravelAgent
              profile:
                profileType: TravelAgent
                companyInfo:
                  companyName: Smith Travel
                  email: customer@example.com
                  phoneNumber: 415.555.0100
                  address:
                    addressLine:
                    - Street 7031 Columbia Gateway Dr.
                    cityName: Columbia
                    postalCode: '21046'
                    country:
                      code: US
                    state: MD
            primary: true
          - profileInfo:
              profileIdList:
              - id: '12345672'
                idContext: Central
                type: Source
              profile:
                profileType: Source
                companyInfo:
                  companyName: Smith Travel POS
                  email: customer@example.com
                  phoneNumber: 415.555.0100
                  address:
                    addressLine:
                    - Street 7031 Columbia Gateway Dr.
                    cityName: Columbia
                    postalCode: '21046'
                    country:
                      code: US
                    state: MD
            primary: true
          - profileInfo:
              profileIdList:
              - id: ''
                idContext: Central
                type: Company
              profile:
                profileType: Company
                companyInfo:
                  companyName: Oracle Corporation
                  email: customer@example.com
                  phoneNumber: 415.555.0100
                  address:
                    addressLine:
                    - Street 7031 Columbia Gateway Dr.
                    cityName: Columbia
                    postalCode: '21046'
                    country:
                      code: US
                    state: MD
              primary: true
        reservationPaymentMethods:
          description: Reservation Payment Method details including payment Card details.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentMethod'
        reservationSpecialRequests:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSpecialRequestsResponse'
        reservationPackages:
          description: Details of the Packages added to the reservation.
          type: array
          items:
            $ref: '#/components/schemas/ReservationPackages'
        reservationMemberships:
          type: array
          items:
            $ref: '#/components/schemas/ReservationMembership'
        hotelCode:
          description: The unique identifier of the Property in Channel system.
          type: string
          example: XUSXXYY99
        comments:
          type: array
          description: Comments associated to the Reservation
          items:
            type: object
            properties:
              comment:
                $ref: '#/components/schemas/CommentType'
        reservationStatus:
          type: string
          enum:
          - Reserved
          - ReservedChanged
          - Cancelled
          - OnHold
          example: Reserved
        printRate:
          type: boolean
          description: Defines if the rate is printed on various correspondence. Possible values are 'true' or 'false'.
          example: false
        optedForCommunication:
          type: boolean
          description: Defines if guest agreed to receive correspondence from the property via email, phone, letter, etc. Possible values are 'true' or 'false'.
          example: false
        travelPurpose:
          description: Indicates the purpose of Guest Stay
          type: string
          enum:
          - Leisure
          - Business
      required:
      - roomStay
      - reservationGuests
      - reservationPaymentMethods
    GetResponseItem:
      type: object
      properties:
        reservationIds:
          type: array
          items:
            $ref: '#/components/schemas/CancelReservationIdResponse'
          example:
          - id: '5030863'
            type: Others
            idContext: CH1
            idExtension: '1'
          - id: LZDI6496738895
            type: Confirmation
            idContext: Central
            idExtension: '1'
          - id: '2342342'
            type: Reservation
            idContext: Central
            idExtension: '1'
        reservationPayload:
          $ref: '#/components/schemas/ReservationPayloadGet'
        creationDate:
          type: string
          description: 'Date and time when this reservation was created, including time zone information. Timestamp as defined in ISO 8601 format and always be in the following format: YYYY-MM-DDThh:mm:ssZ (time is UTC).'
          format: date-time
          example: '2023-11-17T12:21:00Z'
      required:
      - reservationIds
      - reservationPayload
    GuestCount:
      type: object
      description: Reservation Guest Count details in room Stay level
      properties:
        childAges:
          description: Ages of children
          type: array
          items:
            type: integer
            format: int32
          example:
          - 4
          - 9
          - 17
        adults:
          description: Number of adults
          type: integer
          format: int32
          example: 2
        children:
          description: Number of children
          type: integer
          format: int32
          example: 3
      required:
      - adults
    BlockIdList:
      type: object
      properties:
        id:
          description: Unique OPERA Block ID which is a primary identification of a Block in OPERA.
          type: string
          maxLength: 40
          example: ABCEVENT0523
        type:
          description: Type of the Block Id. Valid value 'BlockCode'
          type: string
          enum:
          - BlockCode
    ProfileIdListRequest:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: The unique ID associated with that profile
          idContext:
            type: string
            example: Central
