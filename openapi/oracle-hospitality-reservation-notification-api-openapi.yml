          - Business
      required:
      - reservationIdList
      - roomStay
      - reservationGuests
      - reservationPaymentMethods
    Address:
      type: object
      properties:
        addressLine:
          description: Guest Address Details
          type: array
          minItems: 1
          items:
            type: string
          example:
          - Street 7031 Columbia Gateway Dr.
        cityName:
          description: Name of the City
          type: string
          example: Columbia
        postalCode:
          description: Postal Code of the Guest Address
          type: string
          example: Z23457A9
        country:
          $ref: '#/components/schemas/Country'
        state:
          description: State Code.
          type: string
          example: MD
    CurrencyCode:
      type: string
      description: "The rate currency code. This should be ISO currency code.\n  *  Matches regex pattern: [A-Z]{3}\n  *  Length of string must be less than, or equal to 3\n  *  Length of string must be greater than, or equal to 3\n"
      example: USD
    MealPlan:
      type: object
      properties:
        mealPlanIncluded:
          description: Type of meal plan
          type: object
          $ref: '#/components/schemas/RatePlanMealPlanType'
        mealPlanCode:
          description: The meal plan code
          type: string
          example: '1'
        mealPlanDescription:
          description: The meal plan description
          type: string
          example: All inclusive meal plan
        mealsIncluded:
          description: Type of meal plan the rate plan includes
          type: array
          items:
            type: string
          example:
          - Breakfast
          - Lunch
          - Dinner
    BookingResponse:
      type: object
      properties:
        reservationIds:
          type: array
          items:
            $ref: '#/components/schemas/ReservationIdResponse'
          example:
          - id: '5030863'
            type: Others
            idContext: CH1
            idExtension: '1'
          - id: LZDI6496738895
            type: Confirmation
            idContext: Central
            idExtension: '1'
          - id: '2342342'
            type: Reservation
            idContext: Central
            idExtension: '1'
        reservationPayload:
          $ref: '#/components/schemas/ReservationPayload'
      required:
      - reservationIds
      - reservationPayload
    ExpectedTimesType:
      type: object
      description: Expected Arrival and Departure Time information.
      properties:
        reservationExpectedArrivalTime:
          description: Indicates the expected Arrival Time of the reservation guest.
          type: string
          format: date-time
          example: '2026-11-17T12:21:00.000Z'
        reservationExpectedDepartureTime:
          description: Indicates the expected Departure Time of the reservation guest.
          type: string
          format: date-time
          example: '2026-11-20T12:21:00.000Z'
    ReservationSpecialRequestsResponse:
      type: object
      properties:
        requestCodes:
          description: Collection of special requests such as Preferences for a reservation guest
          type: array
          items:
            $ref: '#/components/schemas/RequestCodesResponse'
        requestCodeType:
          type: string
          minLength: 0
          maxLength: 20
          example: SPECIALS
          description: Group code of special request such as specials, feature, bed feature, etc.
        requestCodeTypeContext:
          type: string
          description: It represents request code and request type are OHD configured values.
          enum:
          - Central
    InfoRoomRate:
      type: object
      properties:
        rates:
          type: object
          properties:
            rate:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RoomRate'
          required:
          - rate
        guestCounts:
          $ref: '#/components/schemas/GuestCount'
        reservationBlock:
          type: object
          description: Block related information
          properties:
            blockIdList:
              description: List of Block Ids
              type: array
              items:
                $ref: '#/components/schemas/BlockIdList'
        roomType:
          type: string
          description: Room Type Code for which the reservation is requested for.
          example: XA1K
        ratePlanCode:
          type: string
          description: '* Rate Plan Code for which the reservation is requested.

            * Rate plan code is mandatory for Transient ( non Block) reservation requests.

            * Rate Plan Code is optional if the reservation is for a Business Block.

            '
          example: XDAILY
        roomId:
          type: string
          minLength: 0
          maxLength: 20
          description: Room Number to be assigned to the reservation.
          example: '301'
        suppressRate:
          type: boolean
          description: Used to suppress the display of the room rate in various correspondence. Possible values are 'true' or 'false'.
          example: true
        numberOfUnits:
          type: integer
          format: int32
          description: Number of rooms to be booked for this reservation
          example: 1
        marketCode:
          type: string
          description: The code that relates to the market being sold to (e.g., the corporate market, packages).
          example: BR
        sourceCode:
          type: string
          description: To specify where the business came from e.g.radio, newspaper ad, etc.
          example: OTA
        start:
          description: 'Effective Start Date of the room rate.

            * Value must be of format ''date''

            '
          type: string
          format: date
          example: '2024-05-16'
        end:
          description: 'Effective End Date of the room rate.

            * Value must be of format ''date''

            '
          type: string
          format: date
          example: '2024-05-16'
      required:
      - rates
      - guestCounts
      - roomType
      - start
      - end
    ReservationGuestResponse:
      type: object
      description: Reservation Guest Information
      properties:
        profileInfo:
          type: object
          properties:
            profileIdList:
              $ref: '#/components/schemas/ProfileIdListResponse'
            profile:
              $ref: '#/components/schemas/Profile'
          required:
          - profile
        primary:
          type: boolean
          example: true
          description: Indicates if the profile is primary if multiple profiles of the same type are being sent. Should be true by default if only one profile of same type is sent
        arrivalTransport:
          description: Arrival Transport details of the Guest
          $ref: '#/components/schemas/ReservationTransport'
        departureTransport:
          description: Departure Transport details of the Guest
          $ref: '#/components/schemas/ReservationTransport'
      required:
      - profileInfo
    RequestCodes:
      type: object
      properties:
        requestCodeValue:
          description: Special request code from OHD configuration
          example: PILLOW
          type: string
          minLength: 0
          maxLength: 200
    CancelReservationIdResponse:
      type: object
      properties:
        id:
          type: string
          description: Global reservation number from external channel. Maximum length is 50 alphanumeric characters without spaces.
          example: '5030863'
        type:
          type: string
          description: Type of id
          enum:
          - Others
          - Confirmation
          - Reservation
          - Cancellation
          example: Others
        idContext:
          type: string
          description: Context of the Id.
          example: CH1
        idExtension:
          type: string
          description: This is the index number for multi leg reservations. Numeric values only.
          example: '1'
    ProfileIdListResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: The unique ID associated with that profile
          idContext:
            type: string
            example: Central
            description: 'The Context of the ID sent above. Possible Values : Central'
          type:
            type: string
            description: 'The type of profile being sent Possible Values : Guest, TravelAgent, Source, Company and Profile'
    RoomStayRequest:
      type: object
      description: List of room stay information including Room Rates, Promotion, Guest Counts and Guarantee
      properties:
        arrivalDate:
          type: string
          format: date
          description: Arrival Date of the Reservation. Value must be of format YYYY-MM-DD
          example: '2024-05-16'
        departureDate:
          type: string
          format: date
          description: Departure Date of the Reservation. Value must be of format YYYY-MM-DD
          example: '2024-05-17'
        roomRates:
          type: array
          description: Room Rate Information
          minItems: 1
          items:
            $ref: '#/components/schemas/InfoRoomRate'
        promotion:
          description: Details of Promotion attached to the reservation.
          type: object
          properties:
            promotionCode:
              type: string
              minLength: 0
              maxLength: 20
              description: Promotion code associated with the promotional offers.
              example: CASINO
        guestCounts:
          type: object
          description: Guest Counts details of the reservation.
          properties:
            adults:
              type: integer
              format: int32
              description: Adults count
              example: 2
            children:
              type: integer
              format: int32
              description: Children count
              example: 3
            childAges:
              description: Ages of children
              type: array
              items:
                type: integer
                format: int32
              example:
              - 4
              - 9
              - 17
          required:
          - adults
        total:
          type: object
          description: 'Reservation Total Rate Information

            * If the rate plan is configured as Tax Inclusive, Amount After Tax is returned.

            * If the rate Plan is configured as Tax Exclusive, Amount Before Tax is returned.

            '
          properties:
            taxes:
              type: object
              description: Total Tax details applicable for this reservation
              $ref: '#/components/schemas/Taxes'
            currencySymbol:
              type: string
              description: Symbol of Rate Currency.
              example: $
            decimalPlaces:
              type: integer
              format: int32
              description: Rate Amount decimal Places.
              example: 1
            rateOverride:
              type: boolean
              description: Indicated if the rate is overridden or not.
              example: true
            amountAfterTax:
              type: number
              example: 214.5
              description: Reservation Total Rate including all known taxes, fees and surcharges.
            amountBeforeTax:
              type: number
              description: Reservation Total Rate excluding all known taxes, fees and surcharges.
              example: 200
            currencyCode:
              $ref: '#/components/schemas/CurrencyCode'
        guarantee:
          type: object
          description: Reservation guarantee details.
          properties:
            guaranteeCode:
              type: string
              example: CC
              description: 'Accepts Property Guarantee Code.

                Either of guaranteeCode or guaranteeType should be provided.

                If no guaranteeCode and no guaranteeType is provided the reservation will be created as Non Guaranteed (OTA Code : 38). Both guaranteeType and guaranteeCode should not be sent in a single reservation request; if sent the reservation would be rejected.

                '
            guaranteeType:
              type: string
              example: '5'
              description: 'Accepts OTA Standard Guarantee Type.

                Possible Values : (5, 8, 19, 22, 38) where 5 = Credit Card, 8 = Deposit, 19 = Travel agency IATA number, 22 = Frequent guest, 30 = Corporate ID/CD Number, 38 = None.

                Either of guaranteeCode or guaranteeType should be provided.

                If no guaranteeType and no guaranteeCode is provided the reservation will be created as Non Guaranteed (OTA Code : 38). Both guaranteeType and guaranteeCode should not be sent in a single reservation request; if sent the reservation would be rejected.

                '
            onHold:
              type: boolean
              example: false
              description: If true indicates this Guarantee Code is used only to hold the inventory during reservation process.
        printRate:
          type: boolean
          description: Defines if the rate is printed on various correspondence. Possible values are 'true' or 'false'.
          example: false
        expectedTimes:
          description: Expected Arrival and Departure Time information.
          $ref: '#/components/schemas/ExpectedTimesType'
        bookingMedium:
          description: Indicates the Origin of the reservation
          type: string
          minLength: 1
          maxLength: 20
          example: OTA
      required:
      - arrivalDate
      - departureDate
      - roomRates
    RoomStayResponseGet:
