          accessCode:
            description: The access code for a negotiated rate plan.
            type: string
          identificationRequired:
            type: boolean
            description: Indicates if an ID is required during the Check-In for this rate booking
          accountId:
            description: The account id assigned to to specific rate plan.
            type: string
          ratePlanLevel:
            description: The rate level the rate plan is associated to.
            type: string
          ratePlanCategory:
            description: The rate category the rate plan is associated to.
            type: string
          gdsDescription:
            description: Multi line description of the rate plan.
            type: object
            $ref: '#/components/schemas/Description'
          commissionable:
            description: When true the Rate Plan is commissionable.
            type: boolean
            example: true
            default: false
          commissionDescription:
            description: Description of the commission associated to the rate plan.
            type: string
            example: Commission of 10% available.
          commission:
            description: Information on commission rate associated to the rate plan.
            type: object
            $ref: '#/components/schemas/OfferRatePlanCommission'
          packages:
            description: List of package elements and/or package groups associated to the rate plan.
            type: array
            items:
              $ref: '#/components/schemas/RatePackage'
          mealPlan:
            description: Details on meal plans included with the rate plan.
            type: object
            $ref: '#/components/schemas/OfferMealPlan'
          promotionCodes:
            description: List of promotion codes associated with rate plan.
            type: array
            items:
              $ref: '#/components/schemas/PromotionCodeItem'
    CalculationRuleType:
      type: string
      description: Simple type for package calculation rules.
      enum:
      - FlatRate
      - PerPerson
      - PerAdult
      - PerChild
      - PerRoom
    OfferMealPlan:
      description: Details on meal plans included with the rate plan.
      type: object
      properties:
        mealPlanIncluded:
          description: Type of meal plan - DEPRECATED AND WILL BE REMOVED IN FUTURE VERSIONS
          type: object
          $ref: '#/components/schemas/OfferRatePlanMealPlanType'
        mealPlanCode:
          description: The code of the meal plan included to the rate plan.
          type: string
          example: '1'
        mealPlanDescription:
          description: Description of the meal plan included to the rate plan.
          type: string
          example: All inclusive meal plan
        mealsIncluded:
          description: List of meal plan types included to the rate plan.
          type: array
          items:
            $ref: '#/components/schemas/OfferRatePlanMealType'
    BlockInformation:
      description: Block related information
      type: object
      properties:
        blockCode:
          description: A code to retrieve price and availability from OPERA Cloud business block
          type: string
          minLength: 1
          maxLength: 20
        blockId:
          description: Unique OPERA Block ID which is a primary identification of a Block in OPERA
          type: string
          minLength: 1
          maxLength: 40
        blockName:
          description: Name of block
          type: string
          minLength: 1
          maxLength: 2000
    OfferRatePlanAvailabilityStatus:
      type: string
      enum:
      - AvailableForSale
      - NoAvailability
      - NotFound
      - Restricted
      description: "Availability status of the rate plan.\nAvailableForSale - Rate plan is available for sale\nNoAvailability - Rate plan is not available for sale\nNotFound - Rate plan is invalid or can't be located\nRestricted - Rate plan is restricted  \n"
    PropertyOffersHotelAmenity:
      type: object
      properties:
        hotelAmenity:
          description: The code for an amenity offered at the property.
          type: string
          example: '12'
        description:
          description: Description of the amenity offered at the property.
          type: string
          example: Swimming Pool
        quantity:
          description: The number of amenities within the property amenity code.
          type: integer
          example: 1
        includeInRate:
          description: When true indicates the property amenity is included with the room rate.
          type: boolean
          example: true
        confirmable:
          description: When true indicates there is a need to contact the property to confirm the availability of the property amenity.
          type: boolean
          example: false
    Transportation:
      type: object
      properties:
        transportationCode:
          type: string
          description: The code of the transportation service such as Bus, Taxi. Enum values from globalCodes TRP - Transportation Code
          example: Metro
        description:
          description: Description of the transportation service.
          type: string
          maxLength: 1024
          example: Red line metro
        includeInRate:
          type: boolean
          description: When true the transportation service is included with the room rate.
          example: false
        reservationRequired:
          type: boolean
          description: When true a reservation is required for the transportation service.
          example: true
    OfferCalendarItem:
      type: object
      properties:
        arrivalDate:
          description: Arrival date provided on the request, this will be used as the starting date to search for rates.
          type: string
          format: date
          example: '2021-06-01'
        availability:
          $ref: '#/components/schemas/OfferAvailabilityStatus'
        rate:
          description: The best available rate
          $ref: '#/components/schemas/OfferMinMaxTotalType'
        roomType:
          description: The code for the available room type.
          type: string
          minLength: 1
          maxLength: 50
          x-example: XA1K
        ratePlanCode:
          description: The code for the available rate plan.
          type: string
          minLength: 1
          maxLength: 50
          x-example: XDAILY
        promotionCode:
          description: Promotion code used for the rate plan when applicable.
          type: string
          minLength: 1
          maxLength: 50
          x-example: EARLYBIRD
        total:
          $ref: '#/components/schemas/OfferTotalTaxSurchargeType'
        restrictions:
          description: List of restrictions in case no offers available for the calendar day.
          type: array
          items:
            $ref: '#/components/schemas/Restriction'
    OffsetTimeUnit:
      description: Time unit used to define the rule.
      type: string
      enum:
      - Day
    OfferRoomTypeAvailabilityStatus:
      type: string
      enum:
      - AvailableForSale
      - NoAvailability
      - NotFound
      - BelowRequestedUnits
      description: 'Indicates the availability status of the room type.

        AvailableForSale - Room type is available for sale

        NoAvailability - Room type is not available for sale

        NotFound - Room type is invalid or can''t be located

        BelowRequestedUnits - The selected room type has units below the number of units requested

        '
    PropertyCalendarResponse:
      type: object
      properties:
        roomStays:
          description: List of  rates per day at the property including property information, rate availability, and availability status of the property.
          type: array
          items:
            $ref: '#/components/schemas/PropertyCalendarRoomStay'
    ExceptionDetail:
      description: Common Error Response format
      type: object
      properties:
        title:
          type: string
          description: Short, human-readable summary of the problem.  The summary SHOULD NOT change for subsequent occurrences of the problem, except for purposes of localization.
          example: Error in Application
        status:
          type: integer
          description: HTTP status code for this occurrence of the problem, set by the origin server.
          example: 400
        o:errorCode:
          type: string
          description: Business specific Error code, which is different from HTTP error code.
          example: RSV-34534534
        type:
          type: string
          description: Absolute URI [RFC3986] that identifies the problem type. When dereferenced, it SHOULD provide a human-readable summary of the problem.
          example: http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.4
        timestamp:
          type: string
          format: date-time
          description: The UTC Date and Time of the Error happened.
          example: '2022-01-02T11:30:22.234Z'
        o:errorDetails:
          description: Details of the error message, consisting of a hierarchical tree structure
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
        logId:
          type: integer
          description: An ID for support reasons to be able identify errors better.
          example: '334543532224'
    OfferAlternateOffersItem:
      type: object
      properties:
        arrivalDate:
          description: Arrival date provided on the request; starting date to search for alternate offers.
          type: string
          format: date
          example: '2021-06-01'
        availability:
          $ref: '#/components/schemas/OfferAvailabilityStatus'
        rate:
          description: The best available rate
          $ref: '#/components/schemas/OfferMinMaxTotalType'
        roomType:
          description: The code for the available room type.
          type: string
          minLength: 1
          maxLength: 50
          x-example: XA1K
        ratePlanCode:
          description: The code for the available rate plan.
          type: string
          minLength: 1
          maxLength: 50
          x-example: XDAILY
        promotionCode:
          description: Promotion code used for the rate plan when applicable.
          type: string
          minLength: 1
          maxLength: 50
          x-example: EARLYBIRD
        total:
          $ref: '#/components/schemas/OfferTotalTaxSurchargeType'
        restrictions:
          description: List of restrictions in case no offers available for the day.
          type: array
          items:
            $ref: '#/components/schemas/Restriction'
    OfferOverallRateInformation:
      description: Rate plan information of the offer.
      type: object
      properties:
        rateModeAmount:
          $ref: '#/components/schemas/OfferTotalType'
        additionalGuestAmounts:
          description: List of charges for each additional adult and/or child.
          type: array
          items:
            $ref: '#/components/schemas/OfferAdditionalGuestAmountType'
        rateMode:
          $ref: '#/components/schemas/OfferRateMode'
        rateTimeUnit:
          $ref: '#/components/schemas/OfferRateTimeUnit'
    Email:
      type: object
      properties:
        emailType:
          description: The email type.
          type: string
        email:
          description: 'The email address for the specific emailType. '
          type: string
    PackageTotalType:
      description: Information on the total cost for the entire stay, including taxes.
      type: object
      properties:
        amountBeforeTax:
          description: The total amount not including any associated tax (e.g., sales tax, VAT, GST or any associated tax).
          type: number
          example: 100.5
        amountAfterTax:
          description: The total amount including all associated taxes (e.g., sales tax, VAT, GST or any associated tax).
          type: number
          example: 123.2
        currencyCode:
          $ref: '#/components/schemas/CurrencyCodeType'
          example: USD
        taxes:
          description: A collection of taxes.
          $ref: '#/components/schemas/OfferTaxesType'
    AlternatePropertyDistance:
      type: object
      properties:
        distance:
          type: number
          format: double
          description: Numeric value of the distance from the property to the alternate property.
          example: 12
          minimum: 0.01
        distanceUnit:
          type: string
          description: 'Distance measurement unit for the distance from the property to the alternate property.

            Kilometers

            Miles

            '
          $ref: '#/components/schemas/DistanceUnit'
        compassDirection:
          type: string
          description: Relative direction from hotel to alternate property
          $ref: '#/components/schemas/CompassDirection'
        comments:
          type: string
          description: Additional text that describes the alternate property.
          example: Resort3 is the next preferred hotel after Resort1.
    OfferDepositPolicyDeadlineType:
      description: The deadline associated to the deposit rule.
      type: object
      allOf:
      - $ref: '#/components/schemas/PolicyOffsetType'
      - type: object
        properties:
          offsetDropTime:
            description: 'Defines as to when the deposit rule will take effect, works together with offsetTimeUnit and offsetMultiplier.

              BeforeArrival - The rule will take effect before arrival of what is specified in offsetTimeUnit and offsetMultiplier

              AfterBooking - The rule will take effect after booking of what is specified in offsetTimeUnit and offsetMultiplier'
            $ref: '#/components/schemas/DepositOffsetDropTime'
            example: BeforeArrival
          absoluteDeadline:
            description: The date and time the deposit rule will take effect.
            type: string
            format: date-time
            example: '2021-04-01T15:46:40.134Z'
    PropertyPackageListItem:
      type: object
      properties:
        code:
          type: string
          example: BRKFAST
          minLength: 1
          maxLength: 20
        description:
          description: Description of the package.
          example: Breakfast for two
          type: string
          minLength: 0
          maxLength: 200
    AccountType:
      type: string
      enum:
      - Company
      - TravelAgent
      - Source
      description: Rate Plan account type
      example: Company
    OfferDepositPolicy:
      type: object
      description: Deposit Policy Details
      properties:
        revenueType:
          description: Type of revenue
          $ref: '#/components/schemas/OfferPolicyRevenueType'
          example: Rooms
          default: Rooms
        policy:
          description: The deposit rule associated to the deposit policy.
          $ref: '#/components/schemas/OfferDepositPolicyType'
        description:
          description: Description of the deposit rule.
          type: string
          example: Deposit policy description in English
        depositPolicyMethod:
          description: The methods of payment that can be used to pay the deposit.
          type: string
          example: Deposit can be made by AX, MC, VI
        paymentTypes:
          description: List of payment types that can be used to pay the deposit.
          type: array
          items:
            $ref: '#/components/schemas/OfferDepositPolicyPaymentCodeDescriptionType'
    OfferCancelPenalty:
      description: Cancellation Policy Details
      type: object
      properties:
        revenueType:
          description: The revenue type the cancellation policy is associated to.
          $ref: '#/components/schemas/OfferPolicyRevenueType'
          example: Rooms
          default: Rooms
        policy:
          description: The cancellation rule associated to the cancellation policy.
          $ref: '#/components/schemas/OfferCancellationPolicyType'
    OfferDetailsResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/OfferDetailsRoomStay'
    CancelPolicyAmountPercentType:
      description: The method used to compute the penalty associated to the cancellation rule.
      type: object
      allOf:
      - $ref: '#/components/schemas/BasicAmountPercentType'
      - type: object
        properties:
          taxInclusive:
            description: When true the cancellation amount charged includes taxes.
            type: boolean
            example: true
          currencyCode:
            $ref: '#/components/schemas/CurrencyCodeType'
            example: USD
    PropertySearchRatePlan:
      type: object
      properties:
        ratePlanCode:
          description: The code for the rate plan.
          type: string
          example: XDAILY
        accessCode:
          description: The access code for a negotiated rate plan.
          type: string
        ratePlanType:
          description: The rate plan type associated with the rate plan.
          type: string
          example: 10
        identificationRequired:
          description: When true indicates identification is required at checkin.
          type: boolean
        accountId:
          description: The account id assigned to to specific rate plan.
          type: string
        accountType:
          description: Rate Plan account type
          type: string
          $ref: '#/components/schemas/AccountType'
          x-example: Company
        availabilityStatus:
          type: object
          $ref: '#/components/schemas/OfferRatePlanAvailabilityStatus'
        additionalDetails:
          description: Additional information related to the rate plan.
          type: object
          $ref: '#/components/schemas/AdditionalDetails'
        taxInclusive:
          description: When true indicates the rate plan includes applicable taxes.
          type: boolean
          example: true
        promotionCodes:
          description: List of promotion codes associated with rate plan.
          type: array
          items:
            $ref: '#/components/schemas/PromotionCodeItem'
        restrictions:
          description: List of restrictions for rate plan, only populated when rate plan codes are given in request
          type: array
          items:
            $ref: '#/components/schemas/Restriction'
    DepositOffsetDropTime:
      description: Defines as to when the deposit rule will take effect, works together with offsetTimeUnit and offsetMultiplier. <p>  <strong>BeforeArrival</strong> - The rule will take effect before arrival of what is specified in offsetTimeUnit and offsetMultiplier </p>  <strong>AfterBooking</strong> - The rule will take effect after booking of what is specified in offsetTimeUnit and offsetMultiplier</p>
      type: string
      enum:
      - BeforeArrival
      - AfterBooking
    PropertyCalendarRoomStay:
      type: object
      properties:
        propertyInfo:
          $ref: '#/components/schemas/PropertyCalendarPropertyInfo'
        availability:
          $ref: '#/components/schemas/HotelAvailabilityStatus'
        calendarItems:
          description: List of rates starting from arrival date provided on the request, availability status of the rate, and rate detail.
          type: array
          items:
            $ref: '#/components/schemas/OfferCalendarItem'
    GeneralInformation:
      description: General information about the property.
      type: object
      properties:
        checkInTime:
          description: The property's check-in time.
          type: string
          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
          example: 04:30
        checkOutTime:
          description: The property's check-out time.
          type: string
          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
          example: '14:30'
    PropertySearchRoomStay:
      type: object
      properties:
        propertyInfo:
          description: Property information.
          $ref: '#/components/schemas/PropertySearchPropertyInfo'
        availability:
          $ref: '#/components/schemas/HotelAvailabilityStatus'
        ratePlans:
          description: List of rate plans selected during the request including rate plan information, availability status of the rate plan, and commission.
          type: array
          items:
            $ref: '#/components/schemas/PropertySearchRatePlan'
        minRate:
          description: The daily minimum available room rate including additional amounts and fees.
          $ref: '#/components/schemas/OfferMinMaxTotalType'
        maxRate:
          description: The daily maximum available room rate including additional amounts and fees.
          $ref: '#/components/schemas/OfferMinMaxTotalType'
    Address:
      type: object
      description: Address Details such as city, state, country, postal code etc.
      properties:
        addressLine:
          description: Guest Address Details
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 2
          example:
          - Street 123
          - Box 1
        countryCode:
          description: The property's two letter ISO country code.
          type: string
          example: US
        cityName:
          description: Name of the City
          type: string
          example: Miami
        stateProv:
          description: The state where the property is located.
          type: string
          example: Florida
        postalCode:
          description: Postal Code of the Guest Address
          type: string
          example: '90210'
    OfferTotalTaxSurchargeType:
      description: The daily rate of the offer including total tax and total fees (surcharges).
      type: object
      allOf:
      - $ref: '#/components/schemas/OfferTotalType'
      - type: object
        properties:
          totalTax:
            description: Total of all taxes.
            type: number
            example: 23.79
          totalFees:
            description: Total of all fees (surcharges).
            type: number
            example: 25
    RatePackage:
      type: object
      description: Package code details applied to a rate plan.
      properties:
        code:
          description: The code of the package element or package group associated to the rate plan.
          type: string
          minLength: 0
          maxLength: 20
          example: PC1
        description:
          description: Description of the package element or package group associated to the rate plan.
          type: string
          minLength: 0
          maxLength: 20
          example: Package Code Des 1
        postingRhythm:
          $ref: '#/components/schemas/PostingRhythmType'
        calculationRule:
          type: string
          description: The price calculation rule for this package.
          enum:
          - FlatRate
          - PerPerson
          - PerAdult
          - PerChild
          - PerRoom
          example: FlatRate
        includedInRate:
          description: The package price is added to the room rate. DEPRECATED AND WILL BE REMOVED IN FUTURE VERSIONS
          type: boolean
          example: false
        addToRate:
          description: The package price is added to the room rate.
          type: boolean
          example: false
        addRateSeparateLine:
          description: The package price is printed on separate line of the folio. DEPRECATED AND WILL BE REMOVED IN FUTURE VERSIONS
          type: boolean
          example: true
        printSeparateLine:
          description: The package price is printed on separate line of the folio.
          type: boolean
          example: true
        quantity:
          description: Quantity of the package code included in the rate plan.
          type: integer
          example: 1
        inventoryItems:
          type: array
          description: Package Code Inventory Items type.
          items:
            $ref: '#/components/schemas/PackageInventoryItemType'
        packageGroups:
          type: array
          description: Indicates if a package is part of a Package Group bundle.
          items:
            $ref: '#/components/schemas/PackageGroupType'
    PropertyAlternateOffersResponse:
      type: object
      properties:
        roomStays:
          description: List of rates per day at the property including property information, rate availability, and availability status of the property.
          type: array
          items:
            $ref: '#/components/schemas/PropertyAlternateOffersRoomStay'
    OfferRateInformation:
      description: Details on the rate plan of the offer.
      type: object
      properties:
        rate:
          description: Rate plan information of the offer.
          type: object
          $ref: '#/components/schemas/OfferOverallRateInformation'
        cancellationPolicies:
          description: List of cancellation policies associated to the rate plan.
          type: array
          items:
            $ref: '#/components/schemas/OfferCancelPenalty'
        guaranteeRequirement:
          $ref: '#/components/schemas/GuaranteeRequirementType'
          example: GuaranteeRequired
        depositPolicies:
          description: List of deposit policies associated to the rate plan.
          type: array
          items:
            $ref: '#/components/schemas/OfferDepositPolicy'
        paymentPolicies:
          description: List of payment policies for guaranteeing the rate plan.
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/OfferGuaranteePolicy'
        base:
          description: List of date ranges within the stay and corresponding charges.
          type: array
          items:
            $ref: '#/components/schemas/OfferRateRange'
    OfferAgeQualifyingCodeEnum:
      type: string
      enum:
      - Adult
      - Child
      description: 'Indicates if the rate is for each additional adult or child.

        '
    Communications:
      description: The contact information for the property.
      type: object
      properties:
        phones:
          description: List of phone numbers for the property.
          type: array
          items:
            $ref: '#/components/schemas/Phone'
          minItems: 1
        emails:
          description: List of emails addresses for the property.
          type: array
          items:
            $ref: '#/components/schemas/Email'
        urls:
          description: List of urls for the property.
          type: array
          items:
            $ref: '#/components/schemas/Url'
    PropertyOffersRoomStay:
      type: object
      properties:
        propertyInfo:
          $ref: '#/components/schemas/PropertyOffersPropertyInfo'
        availability:
          $ref: '#/components/schemas/HotelAvailabilityStatus'
        restrictions:
          description: List of restrictions for property, only populated when no rate plan codes are given in request
          type: array
          items:
            $ref: '#/components/schemas/Restriction'
        roomTypes:
          description: List of the room types selected during the request including room type information, availability status of the room type, and room amenities.
          type: array
          items:
            $ref: '#/components/schemas/PropertyOffersRoomType'
        ratePlans:
          description: List of the rate plans selected during the request including rate plan information, availability status of the rate plan, and commission.
          type: array
          items:
            $ref: '#/components/schemas/PropertyOffersRatePlan'
        offers:
          description: List of offers at the property, including availability status of the offer and policies associated with the offer.
          type: array
          items:
            $ref: '#/components/schemas/Offer'
