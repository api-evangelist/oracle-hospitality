components:
  parameters:
    ArrivalDate:
      name: arrivalDate
      in: query
      description: Arrival/Check-in Date
      required: true
      x-example: '2021-06-01'
      schema:
        type: string
        format: date
    Children:
      name: children
      in: query
      description: Number of children
      required: false
      x-example: 2
      schema:
        type: integer
        default: 0
        maximum: 10
