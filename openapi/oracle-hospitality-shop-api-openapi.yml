  schemas:
    OfferTotalTypeWithTaxes:
      description: Information on the total cost for the entire stay, including taxes.
      type: object
      properties:
        amountBeforeTax:
          description: The total amount not including any associated tax (e.g., sales tax, VAT, GST or any associated tax).
          type: number
          example: 100.5
        amountAfterTax:
          description: The total amount including all associated taxes (e.g., sales tax, VAT, GST or any associated tax).
          type: number
          example: 123.2
        currencyCode:
          $ref: '#/components/schemas/CurrencyCodeType'
          example: USD
        taxes:
          description: A collection of taxes.
          $ref: '#/components/schemas/OfferTaxesType'
    HotelAvailabilityStatus:
      type: string
      enum:
      - AvailableForSale
      - NoAvailability
      - NotFound
      - OtherAvailable
      description: 'Availability status of the property.

        AvailableForSale - Property has availability based on criteria requested

        NoAvailability - Property has no availability based on criteria requested

        NotFound - Property is invalid or can''t be located

        OtherAvailable - Other available property

        '
    PackageAmountType:
      type: object
      description: Base charge related to a package
      properties:
        base:
          description: List of date ranges within the stay and corresponding charges.
          $ref: '#/components/schemas/PackageBaseType'
    OfferAvailabilityStatus:
      type: string
      enum:
      - AvailableForSale
      - NoAvailability
      description: 'Indicates the availability status of the offer.

        AvailableForSale - Offer is available for sale

        NoAvailability - Offer is not available for sale

        '
    PackageBaseType:
      description: The daily rate of the package.
      type: object
      properties:
        amountBeforeTax:
          description: The package rate not including any associated taxes (e.g., sales tax, VAT, GST or any associated taxes).
          type: number
          example: 100.5
        amountAfterTax:
          description: The package rate including all associated taxes (e.g., sales tax, VAT, GST or any associated tax).
          type: number
          example: 123.2
        currencyCode:
          $ref: '#/components/schemas/CurrencyCodeType'
          example: USD
    PropertyAlternateOffersRoomStay:
      type: object
      properties:
        propertyInfo:
          $ref: '#/components/schemas/PropertyAlternateOffersPropertyInfo'
        availability:
          $ref: '#/components/schemas/HotelAvailabilityStatus'
        offers:
          description: List of alternate offers starting from arrival date provided on the request, availability status of the rate, and rate detail.
          type: array
          items:
            $ref: '#/components/schemas/OfferAlternateOffersItem'
    DistanceUnit:
      description: Distance measurement unit for the distance from the property to the alternate property.
      type: string
      enum:
      - Kilometers
      - Miles
    OfferDepositPolicyPaymentCodeDescriptionType:
      type: object
      properties:
        paymentCode:
          description: The code of the the payment type.
          type: string
          pattern: '''[A-Z0-9.]{0,20}'''
          minLength: 0
          maxLength: 20
          example: AX
        paymentDescription:
          description: Description of the payment type.
          type: string
          minLength: 0
          maxLength: 256
          example: Bank Card Name
    Location:
      description: Details on the location of the property.
      type: object
      properties:
        propertyLocation:
          description: Describes the location of the property.
          type: string
          maxLength: 4000
          example: ABC hills
    PropertyCalendarPropertyInfo:
      description: Property information
      type: object
      properties:
        hotelCode:
          description: A unique identifier for the property.
          type: string
          example: XUSXXYY99
        hotelName:
          description: Name of the property.
          type: string
          example: Resort1
        chainCode:
          description: If the property is part of the chain, the associated chain code.
          type: string
          example: CHAIN1
        isAlternate:
          description: When true indicates the property returned is an alternate property.
          type: boolean
          example: true
    PromotionCodeItem:
      type: object
      properties:
        code:
          description: Promotion code associated with the rate plan.
          type: string
          example: EARLYBIRD
    PackageInventoryItemType:
      type: object
      properties:
        code:
          description: Item code
          type: string
          minLength: 0
          maxLength: 20
          example: ABC123
        quantity:
          description: Quantity of the inventory item.
          type: integer
          example: 1
    OfferTaxType:
      type: object
      description: Applicable tax element. This element allows for both percentages and flat amounts. If one field is used, the other should be zero since logically, taxes should be calculated in only one of the two ways.
      properties:
        description:
          description: Description of the tax or fee.
          type: string
          minLength: 0
          maxLength: 2000
          example: Country generic tax
        code:
          description: The code for the tax.
          type: string
          minLength: 0
          maxLength: 20
          example: VAT
        amount:
          description: The total tax amount of the entire stay for the specific tax code.
          type: number
          example: 30
        currencyCode:
          $ref: '#/components/schemas/CurrencyCodeType'
          example: USD
        codeType:
          description: 'Classification of the code: Tax or Fee.'
          type: string
          enum:
          - Tax
          - Fee
          example: Tax
    OfferPaymentCodeDescriptionType:
      type: object
      description: Payment type entity which contains a code and description
      properties:
        paymentCode:
          description: The code of the the payment type.
          type: string
          pattern: '''[A-Z0-9.]{0,20}'''
          minLength: 0
          maxLength: 20
          example: AX
        cardType:
          description: The code of the the payment type.
          type: string
          pattern: '''[A-Z0-9.]{0,20}'''
          minLength: 0
          maxLength: 20
          example: AX
        paymentDescription:
          description: Description of the payment type.
          type: string
          minLength: 0
          maxLength: 256
          example: Bank Card Name
    OfferDepositPolicyType:
      description: The deposit rule associated to the deposit policy.
      type: object
      properties:
        policyCode:
          description: The code for the deposit rule.
          type: string
          maxLength: 20
          example: DEP_POLICY001
        deadline:
          description: The deadline associated to the deposit rule.
          $ref: '#/components/schemas/OfferDepositPolicyDeadlineType'
          example:
            offsetTimeUnit: Day
            offsetDropTime: BeforeArrival
            offsetUnitMultiplier: 5
        basisType:
          description: Policy basis type which can be Full or Flat Amount, or percentage of/or room nights.
          $ref: '#/components/schemas/PolicyBasisType'
          example: NightPercentage
        amount:
          description: The total amount of deposit due.
          type: number
          example: 55.21
        taxInclusive:
          description: When true the deposit amount due includes taxes.
          type: boolean
          example: true
        nonRefundable:
          description: When true the deposit amount is non-refundable.
          type: boolean
          example: true
    AdditionalDetails:
      type: object
      description: Additional information related to the rate plan.
      properties:
        ratePlanMatches:
          type: boolean
          description: When true indicates there is a match between the rate plan and the requested parameters (ratePlanCode, accessCode, ratePlanType, accountId).
        value:
          description: Parameter used to indicate the rate plan match.
          type: string
          enum:
          - RatePlanCode
          - AccessCode
          - RatePlanType
          - AccountId
    CompassDirection:
      type: string
      enum:
      - N
      - NE
      - E
      - SE
      - S
      - SW
      - W
      - NW
      description: "Relative direction from the property to the alternate property.\nNorth, West, South, East \nN: North, W: West, S: South, E: East, NW: North West, NE: North East, SW: South West, SE: South East\n"
    Occupancy:
      type: object
      description: Details on the occupancy of the room type.
      properties:
        minOccupancy:
          description: The minimum number of individuals allowed in the room type.
          type: integer
          format: int32
          minimum: 0
          example: 2
        maxOccupancy:
          description: The maximum number of individuals allowed in the room type.
          type: integer
          format: int32
          minimum: 0
          example: 8
        maxAdultOccupancy:
          description: The maximum number of adults allowed in the room type.
          type: integer
          format: int32
          minimum: 0
          example: 4
        maxChildOccupancy:
          description: The maximum number of children allowed in the room type.
          type: integer
          format: int32
          minimum: 0
          example: 3
    Restriction:
      type: object
      description: Holds restriction information that is restricting offer from being available
      properties:
        restrictionType:
          type: string
          description: 'Type of restriction. <p> Closed: The offer is not restricted to be available.  </p> <p> ClosedForArrival: Offer is not available with arrival date with this restriction. </p> <p> ClosedForDeparture: Offer is not  available with departure date with this restriction. </p> <p> MinimumStayThrough: Offer duration falls in to this restriction date is not available if minimum number of nights less than set restriction nights. Example if minimum stay through is 2, the offer is not available for less than 2 nights stay. </p> <p> MaximumStayThrough: MaximumStayThrough: Offer duration falls in to this restriction date is not available if maximum number of nights are greater than set restriction nights. Example if maximum stay through is 10, the offer is not available for greater than 10 nights stay. </p> <p> MinimumAdvancedBooking: Offer is not available if arrival date and booking date window is less than this restriction setting. </p> <p> MaximumAdvancedBooking: Offer is not available if arrival date and booking date window is greater than this restriction setting. </p> <p> LOSNotAvailable: If the offer arrival date has this restriction, the offer is available for the duration where length of stay is not restricted. Example if length of stay not available set to Open, close, close, open, open, close, open. Offer arrival date with this restriction is available for number of nights, 1, 4,5, 7, and onwards.</p>'
          enum:
          - Closed
          - ClosedForArrival
          - ClosedForDeparture
          - MinimumStayThrough
          - MaximumStayThrough
          - MinimumLengthOfStay
          - MaximumLengthOfStay
          - MinimumAdvancedBooking
          - MaximumAdvancedBooking
          - LOSNotAvailable
          example: MinimumLengthOfStay
        restrictionValue:
          type: integer
          description: The specific number of days for the selected restriction. This field applies to restriction type MinimumStayThrough, MaximumStayThrough, MinimumLengthOfStay, MaximumLengthOfStay, MinimumAdvancedBooking, and MaximumAdvancedBooking only.
          example: 2
    OfferRoomAmenityAvailabilityStatus:
      type: string
      enum:
      - AvailableForSale
      - NoAvailability
      description: 'Indicates the availability status of the room amenity.

        AvailableForSale - Room amenity is available for sale

        NoAvailability - Room amenity is not available for sale

        '
    Url:
      type: object
      properties:
        url:
          description: The url or internet web address.
          type: string
    OfferMinMaxTotalType:
      type: object
      allOf:
      - $ref: '#/components/schemas/OfferTotalType'
      - type: object
        properties:
          rateMode:
            $ref: '#/components/schemas/OfferRateMode'
          isCommissionable:
            description: When true indicates the rate plan is commissionable.
            type: boolean
            example: true
          hasRateChange:
            description: When true indicates there is a rate change over the course of a multiple night stay.
            type: boolean
            default: false
            example: false
    OfferTaxesType:
      type: object
      description: A collection of taxes.
      properties:
        tax:
          description: An individual tax.
          type: array
          maxItems: 99
          items:
            $ref: '#/components/schemas/OfferTaxType'
        amount:
          description: The total tax amount.
          type: number
          example: 25
        currencyCode:
          $ref: '#/components/schemas/CurrencyCodeType'
          example: USD
        totalTax:
          description: Total of all taxes.
          type: number
          example: 23.79
        totalFees:
          description: Total of all fees.
          type: number
          example: 25
        hotelTaxFeeDescriptions:
          type: array
          description: Hotel Tax / Fee Descriptions
          items:
            type: object
            properties:
              description:
                type: string
                example: 9% City Occupancy Tax
    OfferDetailsPropertyInfo:
      description: Property information
      type: object
      allOf:
      - $ref: '#/components/schemas/PropertyOffersPropertyInfo'
      - type: object
        properties:
          generalInformation:
            description: General information about the property.
            type: object
            $ref: '#/components/schemas/GeneralInformation'
          communications:
            description: The contact information for the property.
            type: object
            $ref: '#/components/schemas/Communications'
          transportations:
            description: List of transportation services that are available to and from the property.
            type: array
            items:
              $ref: '#/components/schemas/Transportation'
          direction:
            description: Details on directions from and to the property.
            type: object
            $ref: '#/components/schemas/Direction'
          location:
            description: Details on the location of the property.
            type: object
            $ref: '#/components/schemas/Location'
    CancelPolicyDeadlineType:
      description: The deadline associated to the cancellation rule.
      type: object
      properties:
        absoluteDeadline:
          description: The date and time the cancellation rule will take effect.
          type: string
          format: date-time
          example: '2021-04-01T15:46:40.134Z'
        offsetFromArrival:
          description: The number of days before the arrival date up to which the rate plan may be cancelled without penalty.
          type: integer
          example: 5
        offsetFromBookingDate:
          description: The number of days after the booking date up to which the rate plan may be cancelled without penalty.
          type: integer
          example: 5
    OfferGuaranteePolicy:
      type: object
      description: Policy for guaranteeing reservation.
      properties:
        guaranteeCode:
          description: The code of the guarantee type.
          type: string
          example: GX
        guaranteeType:
          description: 'The guarantee type associated with the guarantee code. PMT Valid values: 5 = Credit Card, 8 = Deposit, 19 = Travel agency IATA number, 22 = Frequent guest, 38 = None'
          type: string
          example: '5'
        description:
          description: Description of the guarantee type.
          type: string
          example: Credit Card Guaranteed
        paymentTypes:
          description: List of payment types that can be used to guarantee the rate plan.
          type: array
          items:
            $ref: '#/components/schemas/OfferPaymentCodeDescriptionType'
        policyRequirements:
          description: Additional requirement for the payment policy.
          type: object
          $ref: '#/components/schemas/GuaranteePolicyRequirements'
        onHold:
          description: When true the guarantee type is used to only hold and not guarantee the rate plan, works with releaseTime.
          type: boolean
          example: false
        releaseTime:
          description: Time till which the non-guaranteed or on hold  rate plan will be held.
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          example: '22:00'
    PropertyOffersResponse:
      type: object
      properties:
        roomStays:
          description: List of  available offers at the property including property information, availability status of the property, room types and rate plans information.
          type: array
          items:
            $ref: '#/components/schemas/PropertyOffersRoomStay'
    PostingRhythmType:
      type: string
      description: 'The posting frequency of the package element or package group associated to the rate plan.

        EveryNight - Package charge posted every night of the stay

        ArrivalNight - Package charge posted only on arrival night

        EveryXNightsStartingNightY - Package charge posted every X nights, beginning the Y night of stay

        CertainNightsOfTheWeek - Package charge posted on certain night of the stay determined by the property

        LastNight - Package charge posted only on the last night of the stay

        EveryNightExceptArrivalNight - Package charge posted on all nights of the stay except the arrival night

        EveryNightExceptLast - Package charge posted on all nights of the stay except the last night

        EveryNightExceptFirstAndLast - Package posted on all nights of the stay except the first and last nights of the stay

        CustomStaySchedule - Package charge posted on stays determined by the property

        CustomNightSchedule - Package charge posted on nights of the stay determined by the property

        FloatingAllowancePerStay - Allows for the package allowance to be consumed at anytime during the stay

        TicketPosting - Package charge posted immediately when a successful response is received back from the ticketing vendor (requires interface with a vendor)

        '
      enum:
      - EveryNight
      - ArrivalNight
      - EveryXNightsStartingNightY
      - CertainNightsOfTheWeek
      - LastNight
      - EveryNightExceptArrivalNight
      - EveryNightExceptLast
      - EveryNightExceptFirstAndLast
      - CustomStaySchedule
      - CustomNightSchedule
      - FloatingAllowancePerStay
      - TicketPosting
    PackageRatesType:
