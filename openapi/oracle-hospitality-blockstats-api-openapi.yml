      type: object
      description: Base statistic set holder which defines the span of the statistical data.
      properties:
        start:
          type: string
          format: date
          maxLength: 8
        end:
          type: string
          format: date
          maxLength: 8
        stat:
          type: array
          maxItems: 4000
          items:
            $ref: '#/components/schemas/hSKStatType'
        code:
          type: string
    blockStats:
      type: object
      description: Response element for block statistics.
      properties:
        reports:
          description: Statistical report - each report is determined by the requested report in the service request criteria.
          type: array
          items:
            $ref: '#/components/schemas/blockStatReportType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
    hSKStatCategoryType:
      type: object
      description: Defines the codes and corresponding categories for which the data in the other elements has been gathered.
      properties:
        statCode:
          description: Defines where this statistical data is applied.
          type: string
          minLength: 0
          maxLength: 20
        statCodeClass:
          description: Classification of the statistical data.
          type: string
          minLength: 0
          maxLength: 40
        description:
          type: string
          minLength: 0
          maxLength: 2000
        statSet:
          type: array
          maxItems: 4000
          items:
            $ref: '#/components/schemas/hSKStatSetType'
        statCategoryCode:
