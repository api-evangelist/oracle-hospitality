      - name: reportParametersParameterName
        in: query
        description: Name of the parameter.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: reportParametersParameterValue
        in: query
        description: Value of the parameter.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: blockOwnersCode
        in: query
        description: Supported Housekeeping report codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - HouseSummary
            - HouseSummaryMonthToDate
            - HouseSummaryYearToDate
            - ReservationActivity
            - ReservationActivityDaily
            - ReservationActivityMonthToDate
            - ReservationActivityYearToDate
            - ComplimentaryOrHouseUse
            - DailyProjection
            - RoomStatus
            - LastHourStatus
            - Turndown
            - InHouse
            - CheckIns
            - CheckOuts
            - AvailableRooms
            - RoomMaintenance
            - ReservationStatistics
            - VIPGuests
            - AdvanceCheckIn
            - BlockArrivals
            - ReservationsCancellationsToday
            - AIRoomAssignment
            - CompRouting
          uniqueItems: true
      - name: onlyOpportunities
        in: query
        required: false
        description: Indicates that only Opportunity blocks will be fetched.
        schema:
          type: boolean
      - name: multipleHotelsSearchHotelIds
        in: query
        description: Hotel code.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 4000
      - name: blockStatusCode
        in: query
        description: Supported Housekeeping report codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - HouseSummary
            - HouseSummaryMonthToDate
            - HouseSummaryYearToDate
            - ReservationActivity
            - ReservationActivityDaily
            - ReservationActivityMonthToDate
            - ReservationActivityYearToDate
            - ComplimentaryOrHouseUse
            - DailyProjection
            - RoomStatus
            - LastHourStatus
            - Turndown
            - InHouse
            - CheckIns
            - CheckOuts
            - AvailableRooms
            - RoomMaintenance
            - ReservationStatistics
            - VIPGuests
            - AdvanceCheckIn
            - BlockArrivals
            - ReservationsCancellationsToday
            - AIRoomAssignment
            - CompRouting
          uniqueItems: true
      - $ref: '#/components/parameters/authKey'
      - $ref: '#/components/parameters/externalData'
      - $ref: '#/components/parameters/x-app-key'
      - $ref: '#/components/parameters/x-request-id'
      - $ref: '#/components/parameters/x-originating-application'
      - $ref: '#/components/parameters/x-hotelid'
      - $ref: '#/components/parameters/x-externalsystem'
      - $ref: '#/components/parameters/Accept-Language'
      responses:
        '200':
          headers:
            Content-Language:
              description: Audience language
              x-example: en-GB
              schema:
                type: string
                pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
          description: Response element for block statistics.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/blockStats'
        '204':
          description: BlockStats not found.
        '400':
          $ref: '#/components/responses/400'
        '401':
