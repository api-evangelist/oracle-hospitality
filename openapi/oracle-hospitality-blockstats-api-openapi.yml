openapi: 3.2.0
info:
  title: OPERA Cloud Block Block Stats API
  description: APIs to cater for Business Block functionality in OPERA Cloud. <br /><br /> A block is a group of rooms held for guests who are attending an event, meeting, or function. You can create blocks for family reunions, business conferences, weddings, and so on. You can also set aside rooms for the event (block).<br /><br /> Compatible with OPERA Cloud release 26.2.0.0.<br /><br /><p> This document and all content within is available under the Universal Permissive License v 1.0 (https://oss.oracle.com/licenses/upl). Copyright (c) 2020, 2026 Oracle and/or its affiliates.</p>
  version: 26.2.0.0
  termsOfService: https://www.oracle.com/legal/terms.html
  contact:
    email: hospitality_apis_ww_grp@oracle.com
  license:
    name: UPL
    url: https://opensource.org/licenses/upl
servers:
- url: /blk/v1
tags:
- name: BlockStats
  description: Block Statistics provide statistical data of blocks that exist in OPERA Cloud.
paths:
  /blocks/statistics:
    get:
      summary: Get Block statistics
      description: This API retrieves block statistics. <p><strong>OperationId:</strong>getBlockStats</p> <p>This API allows a time span of <strong>90</strong> days.</p>
      operationId: getBlockStats
      parameters:
      - name: hotelId
        in: query
        required: false
        description: Property context of the request.
        schema:
          type: string
      - name: reportCode
        in: query
        description: Supported Housekeeping report codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - HouseSummary
            - HouseSummaryMonthToDate
            - HouseSummaryYearToDate
            - ReservationActivity
            - ReservationActivityDaily
            - ReservationActivityMonthToDate
            - ReservationActivityYearToDate
            - ComplimentaryOrHouseUse
            - DailyProjection
            - RoomStatus
            - LastHourStatus
            - Turndown
            - InHouse
            - CheckIns
            - CheckOuts
            - AvailableRooms
            - RoomMaintenance
            - ReservationStatistics
            - VIPGuests
            - AdvanceCheckIn
            - BlockArrivals
            - ReservationsCancellationsToday
            - AIRoomAssignment
            - CompRouting
          uniqueItems: true
      - name: reportEndDate
        in: query
        description: End date of the report.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: date
      - name: reportStartDate
        in: query
        description: Start date of the report.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: date
      - name: statisticalCode
        in: query
        description: Supported housekeeping statistical codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ApprovedCompPostings
            - StagedCompPostings
            - DeclinedCompPostings
            - CompRoutingInstructionsRequests
            - TotalPhysicalRooms
            - TotalRoomsToSell
            - TotalOutOfOrder
            - TotalOutOfService
            - TotalRevenue
            - PercentRoomsOccupied
            - StayoverRooms
            - StayoverPersons
            - StayoverVIP
            - DeparturesExpectedRooms
            - DeparturesExpectedPersons
            - DeparturesExpectedVIP
            - DeparturesActualRooms
            - DeparturesActualPersons
            - DeparturesActualVIP
            - DeparturesInLastHour
            - ArrivalsInLastHour
            - ArrivalsTotal
            - ArrivalsExpectedRooms
            - ArrivalsExpectedPersons
            - ArrivalsExpectedVIP
            - ArrivalsExpectedRoomsMadeToday
            - ArrivalsExpectedPersonsMadeToday
            - ArrivalsExpectedVIPMadeToday
            - ArrivalsActualRooms
            - ArrivalsActualPersons
            - ArrivalsActualVIP
            - ExtendedStaysRooms
            - ExtendedStaysPersons
            - ExtendedStaysVIP
            - DeparturesTotal
            - EarlyDeparturesRooms
            - EarlyDeparturesPersons
            - EarlyDeparturesVIP
            - DayUseRooms
            - DayUsePersons
            - DayUseVIP
            - WalkInRooms
            - WalkInPersons
            - WalkInVIP
            - CanceledOnArrivalRooms
            - CanceledOnArrivalPersons
            - CanceledOnArrivalVIP
            - ComplimentaryArrivalRooms
            - ComplimentaryArrivalPersons
            - ComplimentaryArrivalVIP
            - ComplimentaryStayoverRooms
            - ComplimentaryStayoverPersons
            - ComplimentaryStayoverVIP
            - ComplimentaryDepartureRooms
            - ComplimentaryDeparturePersons
            - ComplimentaryDepartureVIP
            - HouseUseArrivalVIP
            - HouseUseStayoverRooms
            - HouseUseStayoverPersons
            - HouseUseStayoverVIP
            - HouseUseDepartureRooms
            - HouseUseDeparturePersons
            - HouseUseDepartureVIP
            - MinAvailableTonightRooms
            - MaxOccupiedTonightRooms
            - MaxOccupiedTonightPersons
            - MaxOccupiedTonightVIP
            - MaxPercentageOccupiedTonightRooms
            - BlocksNotPickedUp
