        description: Supported block inventory statistical sorting.
        schema:
          type: string
          enum:
          - Status
          - StatusDescending
          - ArrivalDate
          - BlockAccount
          - Revenue
          - RoomsOwner
          uniqueItems: true
      - name: friday
        in: query
        required: false
        schema:
          type: boolean
      - name: monday
        in: query
        required: false
        schema:
          type: boolean
      - name: saturday
        in: query
