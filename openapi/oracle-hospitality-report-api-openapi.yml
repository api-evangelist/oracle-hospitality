      properties:
        moduleId:
          $ref: '#/components/schemas/uniqueID_Type'
        existingItemName:
          description: The existing item name. This is required for only updates to be done to an user defined field. As one of the required fields is also updateable, and it is one of the key fields to identify the actual column, we will need this.
          type: string
          minLength: 0
          maxLength: 80
        itemName:
          description: Statistic name.
          type: string
          minLength: 0
          maxLength: 80
        description:
          description: Statistic description used in the report.
          type: string
          minLength: 0
          maxLength: 1000
        itemType:
          description: Type of user defined item.
          type: string
          minLength: 0
          maxLength: 1000
        roomsToInclude:
          description: Provides information on the print options for each item.
          type: object
          properties:
            includeDayUse:
              description: This flag includes day-use reservations in calculation of Rooms Occupied.
              type: boolean
            includeNoShow:
              description: This flag includes no-show reservations in calculation of Rooms Occupied.
              type: boolean
            excludeHouseUse:
              description: This flag excludes house-use reservations from calculation of Rooms Occupied.
              type: boolean
            excludeComplimentaryReservations:
              description: This flag exclude complimentary reservations from calculation of Rooms Occupied.
              type: boolean
            excludeOOORooms:
              description: This flag exclude out-of-order rooms from calculation of Total Rooms in Hotel.
              type: boolean
            excludeOOSRooms:
              description: This flag exclude out-of-service rooms from calculation of Total Rooms in Hotel.
              type: boolean
        printOptions:
          description: Provides information on the print options for each item.
          type: object
          properties:
            defaultPrintSequence:
              description: Default Print sequence of item.
              type: integer
            printSequence:
              description: Print sequence of item defined by the user.
              type: integer
            printLineAfterItem:
              description: Print line after item.
              type: boolean
            blankRowsAfterItem:
              description: Number of blank rows after current item.
              type: integer
            amountFormat:
              description: Format for the item.
              type: string
              minLength: 0
              maxLength: 1
        active:
          description: Indicates if the item active or not.
          type: boolean
        userDefinedItem:
          description: Flag indicates if this is a user defined item..
          type: boolean
        managedBy:
          $ref: '#/components/schemas/managedByOptions'
