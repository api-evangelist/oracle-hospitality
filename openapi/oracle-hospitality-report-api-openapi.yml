            $ref: '#/components/schemas/configReportParameterType'
        rowsPerPage:
          description: Rows to be entered for Key Packet report group.
          type: integer
        columnsPerPage:
          description: Columns to be entered for Key Packet report group.
          type: integer
        moduleId:
          description: Module id of the report.
          $ref: '#/components/schemas/uniqueID_Type'
        externalReportUrl:
