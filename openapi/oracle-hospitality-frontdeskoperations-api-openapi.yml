        description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
        schema:
          type: string
      - name: resGuestIdContext
        in: query
        required: false
        description: Used to identify the source of the identifier (e.g., IATA, ABTA).
        schema:
          type: string
      - name: resGuestIdType
        in: query
        required: false
        description: A reference to the type of object defined by the UniqueID element.
        schema:
          type: string
      - name: membershipId
        in: query
        required: false
        description: Membership ID criteria.
        schema:
          type: string
      - name: membershipLevelCodes
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 4000
      - name: membershipTypeCodes
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 4000
      - name: surname
        in: query
        required: false
        description: Family name, last name.
        schema:
          type: string
      - name: givenName
        in: query
        required: false
        description: Given name, first name or names
        schema:
          type: string
      - name: cityName
        in: query
        required: false
        description: City (e.g., Dublin), town, or postal station (i.e., a postal service territory, often used in a military address).
        schema:
          type: string
      - name: postalCode
        in: query
        required: false
        description: Post Office Code number.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: State or Province name (e.g., Texas).
        schema:
          type: string
      - name: countryCode
        in: query
        required: false
        description: Code for a country or a nationality.
        schema:
          type: string
      - name: streetAddress
        in: query
        required: false
        description: First Line of Street Address. For profile search it matches the first Address line.
        schema:
          type: string
      - name: bookingChannelCode
        in: query
        required: false
        description: Booking Channel Code
        schema:
          type: string
      - name: blockHotelId
        in: query
        required: false
        description: The Hotel Code of the Block.
        schema:
          type: string
      - name: blockId
        in: query
        description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
        required: false
