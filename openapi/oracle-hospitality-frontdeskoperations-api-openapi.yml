            - ReservationID
            - Indicators
            - Deposits
            - RevenuesAndBalances
            - GuestServiceStatus
            - MasterInfo
            - CancellationInfo
            - BlockReservations
            - TaxType
            - GuestDeviceNotification
            - RoomAssignedByAI
          uniqueItems: true
      - name: excludeNoPost
        in: query
        required: false
        description: Indicates that reservations with No Post flag should not be expected from the result.
        schema:
          type: boolean
      - name: excludePMRooms
        in: query
        required: false
        description: Indicates that reservations with PM room type should not be expected from the result.
        schema:
          type: boolean
      - name: hasOpenFolio
        in: query
        required: false
        description: Indicates that only reservations with open folio should be expected from the result.
        schema:
          type: boolean
      - name: excludedReservationIds
        in: query
        description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
        required: false
