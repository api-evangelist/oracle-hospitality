      - name: blockIdContext
        in: query
        description: Used to identify the source of the identifier (e.g., IATA, ABTA).
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: blockIdType
        in: query
        description: A reference to the type of object defined by the UniqueID element.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: recordLocator
        in: query
        required: false
        description: GDS Record Locator for reservation.
        schema:
          type: string
      - name: orderByAttributeName
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: orderType
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Asc
            - Desc
          uniqueItems: true
      - name: roomId
        in: query
        required: false
        description: Room number of the reservation to search by.
        schema:
          type: string
      - name: roomType
        in: query
        description: Room Type.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 4000
      - name: fetchInstructions
        in: query
        description: Instruction to fetch whether the room was assigned/upgraded by AI. This will also include Reservation instruction.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
