        in: query
        required: false
        description: Indicates to exclude Advance Checked In Reservations from search result.
        schema:
          type: boolean
      - name: searchTypesSearchType
        in: query
        description: Represents Reservation search type Player Snapshot.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Any
            - DayUse
            - Arrival
            - Arrived
            - Departure
            - WaitList
            - Cancellation
            - CheckedOut
            - NoShow
            - Complimentary
            - InHouse
            - PostStayPendingBalance
            - PreRegistered
            - PostToRoom
            - OpenFolio
            - ScheduledCheckOut
            - Queued
            - MobileCheckout
            - RegisteredAndInHouse
            - ResvBlockTraces
            - GuestMessages
            - MassCancellation
            - Operator
            - Turndown
            - WalkIn
            - AdvanceCheckedIn
            - OpenBalance
            - AutoFolioSettlement
            - Routing
            - PlayerSnapshot
          uniqueItems: true
      - name: reservationStatus
        in: query
        description: Reservation status type for reservations search.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Cancelled
            - CheckedOut
            - CheckedIn
            - DueIn
            - DueOut
            - InHouse
            - NoShow
            - WaitList
          uniqueItems: true
      - $ref: '#/components/parameters/authKey'
      - $ref: '#/components/parameters/externalData'
      - $ref: '#/components/parameters/x-app-key'
      - $ref: '#/components/parameters/x-request-id'
      - $ref: '#/components/parameters/x-originating-application'
      - $ref: '#/components/parameters/x-hotelid'
      - $ref: '#/components/parameters/x-externalsystem'
      - $ref: '#/components/parameters/Accept-Language'
      responses:
        '200':
          headers:
            Content-Language:
              description: Audience language
              x-example: en-GB
              schema:
                type: string
                pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
          description: Response object to the Fetch Reservation Request operation. Based on the criteria, reservation information is returned.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/reservationsInfo'
        '204':
          description: ReservationsForBilling not found.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '413':
          $ref: '#/components/responses/413'
        '414':
          $ref: '#/components/responses/414'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
      tags:
      - FrontDeskOperations
