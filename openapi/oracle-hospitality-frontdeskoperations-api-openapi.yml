        schema:
          type: boolean
      - name: eligiblePseudoRoomsOnly
        in: query
        required: false
        description: 'If set to true, only pseudo rooms that meet ALL of the following conditions are included in the results:

          - Not configured in the OPERA Control Setting for POS Accounts.

          - Not checked out on the current business day (ensures a ''clean'' pseudo room).

          - Excludes rooms named ''Lost Postings Interface Room'' and ''Default Deposit Tax Room''.

          A pseudo room is a room record used for non-inventory or system purposes, such as posting masters or special billing scenarios. Apply this filter to ensure only fully eligible/assignable pseudo rooms are returned.'
        schema:
          type: boolean
