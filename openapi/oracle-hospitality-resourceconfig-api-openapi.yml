      parameters:
      - name: fetchInactive
        in: query
        required: false
        description: Determines wether to fetch inactive records or not.
        schema:
          type: boolean
      - name: codes
        in: query
        description: Codes to be searched.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 4000
      - name: wildCard
        in: query
        required: false
        description: Wildcard search on the code.
        schema:
          type: string
      - name: description
