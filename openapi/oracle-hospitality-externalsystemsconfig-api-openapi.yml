        schema:
          type: boolean
      - name: id
        in: query
        required: false
        schema:
          type: string
      - name: idEditable
        in: query
        required: false
        schema:
          type: boolean
      - name: label
        in: query
        required: false
        schema:
          type: string
      - name: deviceType
        in: query
        required: false
        schema:
          type: string
          enum:
          - Scanner
          - CreditCard
          - Fiscal
          - Device
          uniqueItems: true
      - name: deviceCode
        in: query
        required: false
        schema:
          type: string
          enum:
          - TtiScannerMobile
          - TtiScannerDesktop
          - SamsotechScanner
          - GenScannerDesktop
          - GenScannerMobile
          - ChipAndPin
          - FiscalTerminal
          - Device
          uniqueItems: true
      - name: deviceArea
        in: query
        required: false
        description: The area where the device is installed
        schema:
          type: string
      - name: displayName
        in: query
        required: false
        description: External device display name.
        schema:
          type: string
      - name: mobileYN
        in: query
        required: false
        description: Indicator if device type is mobile or desktop.
        schema:
          type: boolean
      - name: desktopYN
        in: query
        required: false
        description: Indicator if device type is mobile or desktop.
        schema:
          type: boolean
      - name: registerAddress
        in: query
        required: false
        description: The address which the Cash Register ID ( Device ID ) is associated with.
        schema:
          type: string
      - name: deviceValue
        in: query
        required: false
        description: External device Value.
        schema:
          type: string
      - $ref: '#/components/parameters/authKey'
      - $ref: '#/components/parameters/externalData'
      - $ref: '#/components/parameters/x-app-key'
      - $ref: '#/components/parameters/x-request-id'
