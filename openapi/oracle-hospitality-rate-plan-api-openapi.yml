  /hotels/{hotelId}/blocks/ratePlans:
    get:
      summary: Get rate plans for a given block
      description: 'This API allows you to fetch Rate Plans on a specific block.

        OperationId:getRatePlansForBlock'
      operationId: getRatePlansForBlock
      parameters:
      - name: hotelId
        in: path
        required: true
        description: Unique ID that identifies a single hotel property.
        schema:
          type: string
          maxLength: 2000
          minLength: 1
      - name: ratePlanCode
        in: query
        description: Rate Plan code.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 4000
      - name: beginDate
        in: query
        required: false
        description: Start sell date of the rate code.
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        description: End sell date of the rate code.
        schema:
          type: string
          format: date
      - name: companyId
        in: query
        required: false
        description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
        schema:
          type: string
      - name: companyIdType
        in: query
        required: false
        description: A reference to the type of object defined by the UniqueID element. Refer to OpenTravel Code List Unique ID Type (UIT).
        schema:
          type: string
      - name: sourceId
        in: query
        required: false
        description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
        schema:
          type: string
      - name: sourceIdType
