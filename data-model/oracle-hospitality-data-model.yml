  - openapi/oracle-hospitality-property-v1-blkcfg.json
- name: profile
  key: profileId
  domain: profiles
  subtypes: [guest, company, travelAgent, source, contact, group]
  description: Guest, company, travel agent, source and contact profiles, with addresses, communications,
