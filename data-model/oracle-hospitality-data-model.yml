- name: hotel
  key: hotelId
  domain: enterprise
  aliases: [property, resort]
  description: The OPERA property code. The root scoping key for the whole platform, carried on the
    x-hotelid header.
  specs:
  - openapi/oracle-hospitality-property-v1-entcfg.json
  - openapi/oracle-hospitality-property-v1-rmcfg.json
- name: reservation
  key: reservationId
  domain: bookings
