envelope_types:
  note: >-
    Every response shares a small set of envelope definitions rather than a hypermedia format. These are
    the most-reused schema names in the corpus.
  types:
  - name: links
    description: Self/related link block appended to most responses.
  - name: status
    description: Response status wrapper carrying warningsType and links.
  - name: warningsType
    description: Non-fatal warning collection.
  - name: exceptionDetailType
    description: Error wrapper carrying an errorInstance collection.
  - name: operaVersion
    description: OPERA version block carrying operaVersionNumberType.
portable_identifiers:
- IATA travel-agency number, with an explicit idContext field ("Used to identify the source of the
  identifier (e.g., IATA, ABTA)")
- IATA 3-letter airport and city codes (airportCode, hotelCityCode)
- GDS record locator (recordLocator)
- OpenTravel UniqueID Type (UIT) code list reference
proprietary_identifiers:
- hotelId
- chainCode and enterpriseID
- reservationId
- profileId
- blockId
- roomId
- accountId
- extSystemCode
- channelCode (Oracle-issued, one per distribution partner, global across properties)
reporting_projection:
  surface: OPERA Cloud Reporting & Analytics (RnA) GraphQL Data APIs
  files: graphql/
  count: 75
  note: >-
    The same entities are re-projected as 75 read-only GraphQL subject areas (bookingsReservation,
    profilesIndividuals, financialGuestLedger, inventoryRooms, ratesCodes, statisticsForecastSummary and
    so on), each exposing exactly one root query field over a denormalised reporting view. Oracle
    recommends these for bulk extraction to avoid load on the transactional platform.
