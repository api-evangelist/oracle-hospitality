source: openapi/ (59 Swagger 2.0 documents, 11,623 definitions, 3,546 operations) + graphql/ (76 SDL documents)
summary: >-
  The OPERA Cloud data model as exposed through OHIP. Everything hangs off the property: hotelId is by far
  the dominant key in the corpus (3,698 occurrences across paths, parameters and schemas), and almost every
  Property API operation is scoped to one hotel by the x-hotelid header. Below the property the model
  splits into four clusters - reservations and stays, profiles and memberships, inventory and rates, and
  financials - with blocks and events bridging group business into all four. Identifiers are Oracle-internal
  surrogate keys with no external registry, except at the travel-industry edges (IATA agency numbers, IATA
  airport/city codes, GDS record locators, OpenTravel UniqueID Type).
