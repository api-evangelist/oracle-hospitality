scheme:
  style: dated ReadMe announcements
  cadence: irregular, tied to OPERA Cloud SaaS release trains
  location: >-
    Oracle publishes API change announcements as an "Upcoming Major Changes" chapter of the OHIP developer
    guide, one dated ReadMe page per announcement. There is no per-release changelog feed, RSS or
    machine-readable release-notes artifact; the specification files themselves are versioned by the OPERA
    Cloud release they are compatible with.
current_version:
  spec_release: 26.2.0.0
  note: >-
    58 of the 59 harvested Swagger documents declare compatibility with OPERA Cloud release 26.2.0.0; the
    OHIP oAuth API declares 21.5.0.0 and the OPI Token Exchange Service declares 1.0.1. The Reporting &
    Analytics GraphQL schemas declare OPERA Cloud RnA release 26.1.0.0.
